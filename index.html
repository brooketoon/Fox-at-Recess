<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Fox at Recess: A Ridge Den Investigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --leaf:#3E8C5C;
  --leaf-deep:#2C6B44;
  --rust:#E2703A;
  --rust-deep:#C25A28;
  --amber:#FFC94D;
  --birch:#FFFAF0;
  --birch-card:#FFFFFF;
  --moss:#7FAE6E;
  --sky:#EAF4EF;
  --charcoal:#2B2A26;
  --shadow-sm:0 1px 3px rgba(30,30,20,.08);
  --shadow-md:0 6px 18px rgba(30,30,20,.12);
  --font-title:"Fredoka","Baloo 2",system-ui,Arial,sans-serif;
  --font-interface:"Lexend","Segoe UI",Roboto,-apple-system,Arial,sans-serif;
  --font-body:"Lexend","Segoe UI",Roboto,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;font-size:18px;}
body{margin:0;background:var(--birch);color:var(--charcoal);font-family:var(--font-body);line-height:1.5;}
h1,h2,h3,h4{font-family:var(--font-title);color:var(--leaf-deep);line-height:1.12;margin:0 0 8px;}
p{margin:0 0 12px;}
button{font-family:var(--font-interface);cursor:pointer;}
a{color:var(--rust-deep);}
.hidden{display:none !important;}
:focus-visible{outline:3px solid var(--rust);outline-offset:2px;}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}

/* ---------- Header ---------- */
.app-header{position:sticky;top:0;z-index:40;background:var(--leaf-deep);border-bottom:3px solid var(--rust);}
.app-header-inner{max-width:1000px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{display:flex;flex-direction:column;line-height:1.2;}
.brand .sis{font-family:var(--font-interface);font-weight:800;font-size:.72rem;letter-spacing:1.1px;text-transform:uppercase;color:var(--amber);}
.brand .grade{font-family:var(--font-interface);font-size:.68rem;color:#b9c7bd;}
.header-title{font-family:var(--font-title);font-weight:600;color:#fff;font-size:1.05rem;flex:1;min-width:120px;}
.header-actions{display:flex;gap:8px;align-items:center;}
.hbtn{background:transparent;border:1px solid #3c5548;color:#dfe9e2;border-radius:9px;padding:7px 12px;font-size:.8rem;font-weight:700;min-height:38px;}
.hbtn:hover{background:#274438;}
#backBtn{background:transparent;border:none;color:var(--rust-deep);font-family:var(--font-interface);font-weight:700;font-size:.9rem;padding:9px 12px;min-height:44px;border-radius:22px;}
#backBtn:hover{background:var(--sky);}

/* ---------- Layout ---------- */
main{max-width:760px;margin:0 auto;padding:22px 16px 18px;}
.screen{animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.card{background:var(--birch-card);border-radius:16px;padding:18px 20px;margin:0 0 18px;box-shadow:var(--shadow-sm);}

/* ---------- Landing ---------- */
.landing-top{text-align:center;padding:6px 0 4px;}
.sis-badge{display:inline-block;background:var(--leaf);color:#fff;font-family:var(--font-interface);font-weight:800;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;padding:6px 14px;border-radius:20px;}
.landing-top .eyebrow{margin:10px 0 2px;font-family:var(--font-interface);font-size:.78rem;letter-spacing:1px;text-transform:uppercase;color:#7c8c81;}
.landing-top h1{font-size:2rem;}

.hero-frame{position:relative;border-radius:20px;overflow:hidden;margin:18px 0;box-shadow:var(--shadow-md);background:linear-gradient(160deg,var(--leaf-deep),var(--leaf));text-align:center;padding:28px 24px 30px;}
.hero-frame .hero-media-wrap{max-width:60%;margin:0 auto 14px;}
.hero-frame .hero-media{width:100%;border-radius:14px;display:block;box-shadow:var(--shadow-sm);}
.hero-frame .hero-media.img-placeholder{aspect-ratio:16/10;}
.hero-frame .hero-eyebrow{font-family:var(--font-interface);font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--amber);margin:0 0 8px;}
.hero-frame h1{color:#fff;font-size:1.9rem;margin:0 0 10px;}
.hero-frame .hero-lead{color:#e4ece6;font-size:1.05rem;max-width:560px;margin:0 auto 8px;}
.tts-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);color:#fff;font-family:var(--font-interface);font-weight:700;font-size:.78rem;border-radius:999px;padding:6px 15px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;margin:2px 0 14px;}
.tts-btn:hover{background:rgba(255,255,255,.22);}
.obj-num{background:var(--rust);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-interface);font-weight:800;font-size:.85rem;flex:none;margin-bottom:6px;}
.std-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:8px 0 4px;}
.std-col{background:var(--sky);border-radius:10px;padding:12px 14px;}
.std-col h4{font-size:.86rem;margin:0 0 6px;color:var(--leaf-deep);}
.std-col p{font-size:.85rem;margin:0;color:#4b564e;}
.framework-callout{background:#FDF3DC;border:1px solid #EBD693;border-radius:12px;padding:14px 16px;margin-top:16px;}
.framework-callout h4{font-size:.82rem;text-transform:uppercase;letter-spacing:.6px;color:#8a6a0f;margin:0 0 6px;}
.framework-callout p{margin:0;font-size:.9rem;color:#5c4d1e;}
@media(max-width:640px){
  .hero-frame .hero-media-wrap{max-width:88%;}
  .std-grid{grid-template-columns:1fr;}
}
.btn{border:none;border-radius:26px;font-family:var(--font-interface);font-weight:800;padding:13px 26px;font-size:1rem;min-height:48px;display:inline-flex;align-items:center;gap:8px;}
.btn-amber{background:var(--amber);color:#3a2c0e;box-shadow:0 3px 0 #b9852a;}
.btn-amber:disabled{background:#e6ddc4;color:#a89b78;box-shadow:none;cursor:not-allowed;}
.path-transition{background:var(--sky);border-radius:14px;padding:14px 16px;margin:0 0 14px;font-size:.94rem;color:#3d4a3f;}
.path-transition-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 8px;}
.path-transition-note{font-size:.78rem;color:#8a8270;font-style:italic;}
.btn-amber:hover{filter:brightness(1.04);}
.btn-rust{background:var(--rust-deep);color:#fff;box-shadow:0 3px 0 #6d3216;}
.btn-outline{background:transparent;border:2px solid var(--leaf);color:var(--leaf-deep);font-weight:800;border-radius:26px;padding:11px 22px;}
.btn-ghost{background:none;border:none;color:var(--rust-deep);font-weight:800;}

.about-lesson{background:var(--birch-card);border-radius:14px;box-shadow:var(--shadow-sm);margin:0 0 16px;overflow:hidden;}
.collapse-head{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;font-family:var(--font-interface);font-weight:800;color:var(--leaf-deep);}
.collapse-head::-webkit-details-marker{display:none;}
.collapse-body{padding:0 18px 18px;font-size:.92rem;color:#4b564e;}
.obj-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px;}
.obj-card{background:var(--sky);border-radius:10px;padding:12px 14px;font-size:.9rem;}
.obj-card p{margin:0;color:#3d4a3f;}
.sect-label{font-family:var(--font-interface);font-weight:800;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:var(--rust-deep);margin:14px 0 6px;}
.std-code{background:var(--leaf);color:#fff;border-radius:6px;padding:2px 8px;font-weight:800;font-size:.8rem;}

.name-setup{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:6px 0 4px;font-size:.85rem;color:#5c6a5f;}
.name-setup input{border:1px solid #d7ddd3;border-radius:9px;padding:8px 11px;font-family:var(--font-interface);font-size:.9rem;flex:1;min-width:160px;}
.utility-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:16px;padding-top:13px;border-top:1px solid #e6e0cf;font-family:var(--font-interface);font-size:.78rem;color:#948a72;}
.utility-row .u-sep{color:#d9d0b8;}
.utility-row button,.utility-row .u-code{background:none;border:none;padding:0;color:#948a72;font-weight:700;font-size:.78rem;min-height:auto;}
.utility-row button:hover{color:var(--rust-deep);text-decoration:underline;}
.landing-footer{text-align:center;font-size:.72rem;color:#a39c86;margin-top:16px;line-height:1.6;}

/* ---------- Trail-cam framed scene (signature device) ---------- */
.scene{position:relative;border-radius:18px;overflow:hidden;margin:0 0 18px;box-shadow:var(--shadow-md);background:linear-gradient(160deg,var(--leaf-deep),var(--leaf));}
.scene .scene-media{width:100%;height:273px;object-fit:cover;display:block;opacity:.9;}
.scene .scene-copy{padding:20px 22px 22px;color:#fff;}
.scene h2{color:#fff;font-size:1.5rem;margin:6px 0 4px;}
.scene .scene-sub{color:#dce9e0;font-size:.98rem;max-width:56ch;}
.scene .stamp{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-interface);font-size:.68rem;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);padding:4px 11px;border-radius:18px;}
.hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;}
.hud .bracket{width:20px;height:20px;border-color:var(--amber);border-style:solid;opacity:.85;}
.hud .bracket.tl{border-width:3px 0 0 3px;}
.hud .bracket.tr{border-width:3px 3px 0 0;}
.hud-tag{position:absolute;bottom:14px;right:16px;background:rgba(15,20,15,.55);color:#f0e6c8;font-family:'Courier New',monospace;font-size:.7rem;letter-spacing:.5px;padding:4px 9px;border-radius:5px;border:1px solid rgba(227,168,59,.4);}

/* ---------- Dialogue / voices ---------- */
.observation-block{background:var(--birch-card);border-left:4px solid var(--leaf);border-radius:12px;padding:14px 17px;margin:0 0 16px;box-shadow:var(--shadow-sm);}
.dialogue-block{background:var(--birch-card);border-left:4px solid var(--leaf);border-radius:12px;padding:14px 17px;margin:0 24px 16px;box-shadow:var(--shadow-sm);}
@media(max-width:640px){.dialogue-block{margin-left:18px;margin-right:18px;}}
.card>.dialogue-block:last-child{margin-bottom:0;}
.dialogue{font-size:1.02rem;line-height:1.55;margin:0 0 9px;}
.dialogue:last-child{margin-bottom:0;}
.dialogue .sp{color:var(--rust-deep);font-weight:800;}
.observation-emphasis{background:#F5F9F6;border:1px solid #D8E8DC;border-radius:9px;padding:10px 12px;margin:2px 0 4px;font-weight:500;}

/* ---------- Phone / group-chat panel ---------- */
.msg-panel{background:#4A4032;border-radius:16px;padding:16px 17px;margin:0 0 18px;box-shadow:var(--shadow-md);border:1px solid rgba(0,0,0,.15);}
.msg-panel .cam-head{display:flex;align-items:center;gap:8px;font-family:'Courier New',monospace;color:var(--amber);font-size:.78rem;letter-spacing:.6px;margin-bottom:10px;}
.msg-panel .cam-head .dot{width:8px;height:8px;border-radius:50%;background:#e14b3a;box-shadow:0 0 0 3px rgba(225,75,58,.25);}
.msg-panel .cam-photo{width:100%;border-radius:10px;display:block;margin-bottom:9px;}
.msg-panel .autolog{font-family:'Courier New',monospace;font-size:.76rem;color:#9fb0a5;background:#141c22;border-radius:7px;padding:8px 10px;margin-bottom:10px;}
.chat-bubble{background:#26323e;color:#e7eef0;border-radius:4px 14px 14px 14px;padding:9px 13px;margin:6px 0;max-width:80%;font-size:.94rem;}
.chat-bubble .who{display:block;font-size:.68rem;color:#7fa88f;font-weight:800;margin-bottom:2px;}

/* ---------- Corkboard / case file ---------- */
.case-file{background:#fbf3e2;border:1px solid #e8dcb8;border-left:6px solid var(--rust);border-radius:10px;padding:16px 18px;margin:0 0 18px;}
.case-file .file-tab{display:inline-block;background:var(--rust);color:#fff;font-family:var(--font-interface);font-weight:800;font-size:.68rem;letter-spacing:1px;text-transform:uppercase;padding:4px 12px;border-radius:6px;margin-bottom:9px;}
.alert-panel{background:#FDF0E4;border:1.5px solid var(--rust);border-radius:12px;padding:14px 17px;margin:0 0 18px;color:#7A3B15;font-size:.92rem;}
.alert-panel strong{color:var(--rust-deep);}

/* ---------- Prompts / fields ---------- */
.prompt-box{display:block;background:var(--sky);border-left:4px solid var(--moss);border-radius:8px;padding:10px 14px;margin:0 0 8px;font-weight:700;color:var(--leaf-deep);font-size:.95rem;}
.field-label{display:block;font-family:var(--font-interface);font-weight:800;font-size:.8rem;color:var(--leaf-deep);margin:4px 0 6px;}
textarea,input[type=text]{width:100%;border:1px solid #d7ddd3;border-radius:10px;padding:11px 13px;font-family:var(--font-body);font-size:.95rem;color:var(--charcoal);resize:vertical;min-height:70px;}
textarea:focus,input:focus{border-color:var(--rust);}

/* ---------- Reveal action ---------- */
.reveal-action{text-align:center;margin:6px 0 18px;}

/* ---------- Station choice ---------- */
.station-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.station-card{position:relative;text-align:left;background:var(--birch-card);border:1px solid #e3ddc9;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;padding:0;display:flex;flex-direction:column;height:100%;}
.station-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--rust);}
.station-card.selected{border:3px solid var(--leaf);box-shadow:0 0 0 3px rgba(62,140,92,.16),var(--shadow-md);transform:none;}
.station-card.selected .st-open{background:var(--leaf);color:#fff;box-shadow:none;}
.station-card .st-top{height:8px;background:linear-gradient(90deg,var(--leaf),var(--rust));flex:none;}
.station-card .st-body{padding:16px 16px 18px;display:flex;flex-direction:column;flex:1;}
.station-card .st-kicker{font-family:var(--font-interface);font-size:.68rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--rust-deep);}
.station-card h3{margin:6px 0 6px;font-size:1.15rem;}
.station-card p{margin:0 0 12px;color:#5a6a5d;font-size:.9rem;}
.station-card .st-open{display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:#3a2c0e;font-family:var(--font-interface);font-weight:800;border-radius:22px;padding:9px 16px;font-size:.86rem;margin-top:auto;align-self:flex-start;}
@media(max-width:640px){.station-grid{grid-template-columns:1fr;}}

/* ---------- Photo gallery (Screen 5A) ---------- */
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px 0 6px;}
.photo-tile{position:relative;border:none;padding:0;border-radius:11px;overflow:hidden;aspect-ratio:1/1;background:#4A4032;box-shadow:var(--shadow-sm);}
.photo-tile .tile-img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92;transition:opacity .12s;}
.photo-tile:hover .tile-img{opacity:1;}
.photo-tile .tile-year{position:absolute;bottom:6px;left:7px;background:rgba(15,20,15,.6);color:#f0e6c8;font-family:'Courier New',monospace;font-size:.66rem;padding:2px 6px;border-radius:4px;}
.photo-tile .tile-seen{position:absolute;top:6px;right:7px;background:var(--moss);color:#fff;font-size:.62rem;font-weight:800;padding:2px 6px;border-radius:10px;display:none;}
.photo-tile.seen .tile-seen{display:block;}
@media(max-width:560px){.gallery-grid{grid-template-columns:repeat(2,1fr);}}

/* ---------- Lightbox modal ---------- */
.drawer-overlay{position:fixed;inset:0;background:rgba(20,20,15,.5);z-index:110;}
.drawer{position:fixed;top:0;bottom:0;width:min(85vw,380px);background:var(--birch-card);box-shadow:var(--shadow-md);z-index:111;display:flex;flex-direction:column;transition:transform .22s ease;}
.drawer.left{left:0;transform:translateX(-100%);border-radius:0 18px 18px 0;}
.drawer.right{right:0;transform:translateX(100%);border-radius:18px 0 0 18px;}
.drawer.open{transform:translateX(0);}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;background:var(--leaf-deep);color:#fff;border-radius:inherit;border-bottom-left-radius:0;border-bottom-right-radius:0;}
.drawer.left .drawer-head{border-radius:0 18px 0 0;}
.drawer.right .drawer-head{border-radius:18px 0 0 0;}
.drawer-head h2{color:#fff;font-size:1.15rem;margin:0;}
.drawer-close{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:50%;width:34px;height:34px;font-size:1.1rem;flex:none;}
.drawer-body{padding:16px 18px 24px;overflow-y:auto;flex:1;}
.drawer-body dt{font-family:var(--font-title);font-weight:600;color:var(--rust-deep);font-size:1rem;margin:14px 0 3px;}
.drawer-body dt:first-child{margin-top:0;}
.drawer-body dd{margin:0 0 4px;font-size:.9rem;color:var(--charcoal);}
.journal-empty{color:#8a8270;font-size:.92rem;font-style:italic;}
.journal-entry{border-left:3px solid var(--moss);padding:2px 0 2px 12px;margin:0 0 16px;}
.journal-entry .je-screen{font-family:var(--font-interface);font-weight:800;font-size:.66rem;letter-spacing:.8px;text-transform:uppercase;color:var(--rust-deep);}
.journal-entry .je-q{font-weight:800;color:var(--charcoal);font-size:.9rem;margin:3px 0 5px;}
.journal-entry .je-a{background:var(--sky);border-radius:8px;padding:8px 10px;font-size:.88rem;color:#3d4a3f;}
.journal-entry .je-a.blank{color:#a39c86;font-style:italic;background:transparent;padding:0;}
.journal-entry.decision .je-a{background:#FDF0E4;color:var(--rust-deep);font-weight:700;}
.modal-box{background:var(--birch-card);border-radius:18px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-md);}
.modal-box .mb-photo-wrap{position:relative;background:#4A4032;}
.modal-box .mb-photo{width:100%;display:block;max-height:300px;object-fit:cover;}
.modal-box .mb-body{padding:18px 20px 20px;}
.modal-box .mb-close{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:34px;height:34px;font-size:1.1rem;}
.modal-box .mb-year{font-family:'Courier New',monospace;color:var(--rust-deep);font-weight:700;font-size:.85rem;margin-bottom:6px;}
.modal-box .mb-note{background:var(--sky);border-radius:9px;padding:10px 12px;font-size:.9rem;color:#3d4a3f;}
.gallery-expand{background:var(--birch-card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);margin-top:16px;animation:fade .2s ease;}
.gallery-expand .ge-photo-wrap{position:relative;background:#4A4032;}
.gallery-expand .ge-photo{width:100%;display:block;max-height:390px;object-fit:cover;}
.gallery-expand .ge-close{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:1.2rem;}
.gallery-expand .ge-body{padding:18px 20px 20px;}
.gallery-expand .ge-meta{font-family:'Courier New',monospace;color:var(--rust-deep);font-weight:700;font-size:.9rem;margin-bottom:8px;}
.gallery-expand .ge-note{background:var(--sky);border-radius:10px;padding:12px 14px;font-size:.95rem;color:#3d4a3f;}
.map-wrap2{position:relative;width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--sky);box-shadow:var(--shadow-sm);}
.map-wrap2 img{width:100%;height:100%;object-fit:cover;display:block;}
.map-wrap2 img.img-placeholder{position:absolute;inset:0;width:100%;height:100%;}
.map-point{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2;}
.map-marker{width:42px;height:42px;min-width:42px;min-height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;font-family:var(--font-interface);font-weight:800;font-size:1rem;color:#fff;cursor:pointer;padding:0;}
.map-marker:focus-visible{outline:3px solid var(--rust-deep);outline-offset:3px;}
.map-marker[aria-pressed="true"]{box-shadow:0 0 0 4px rgba(255,255,255,.85),0 2px 10px rgba(0,0,0,.4);transform:scale(1.14);}
.marker-school{background:var(--leaf-deep);}
.marker-town{background:var(--leaf);}
.marker-forest{background:#5b7a4a;}
.marker-sighting{background:var(--rust-deep);}
.marker-den{background:var(--rust);}
.marker-camera{background:#3d4a56;}
.map-point-label{background:rgba(255,255,255,.95);color:var(--charcoal);font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:8px;white-space:nowrap;box-shadow:var(--shadow-sm);max-width:120px;overflow:hidden;text-overflow:ellipsis;}
.map-legend{display:flex;flex-wrap:wrap;gap:10px 18px;margin:14px 0 4px;font-size:.86rem;}
.map-legend span{display:inline-flex;align-items:center;gap:7px;font-weight:700;}
.map-legend i{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.map-info-panel{background:var(--birch-card);border:1px solid #e3ddc9;border-left:4px solid var(--rust);border-radius:12px;padding:14px 16px;margin-top:8px;min-height:56px;}

/* ---------- Decision Point 2 interactives ---------- */
.timeline-shell{background:var(--birch-card);border-radius:16px;padding:18px 20px;margin:0 0 18px;box-shadow:var(--shadow-sm);}

.timeline-years{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px;}
.timeline-year-btn{border:1px solid #d7ddd3;background:#fff;color:var(--charcoal);border-radius:12px;padding:9px 5px;font-family:var(--font-interface);font-weight:800;font-size:.78rem;min-height:42px;position:relative;}
.timeline-year-btn.active{background:var(--leaf-deep);border-color:var(--leaf-deep);color:#fff;}
.timeline-year-btn.viewed:not(.active)::after{content:"✓";position:absolute;top:-6px;right:-5px;width:18px;height:18px;border-radius:50%;background:var(--moss);color:#fff;font-size:.65rem;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}
.timeline-look{background:#FDF3DC;border:1px solid #EBD693;border-radius:12px;padding:13px 15px;margin:14px 0 0;}

.identifier-wrap{position:relative;width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--sky);box-shadow:var(--shadow-sm);}

.food-record-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0 14px;}

/* ---------- Decision Point 1 convergence ---------- */
.team-share-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 18px;}
.team-report{background:var(--birch-card);border:1px solid #e3ddc9;border-radius:14px;padding:16px 17px;box-shadow:var(--shadow-sm);}
.team-report.yours{border-top:6px solid var(--leaf);}
.team-report.shared{border-top:6px solid var(--rust);}
.team-report .tr-kicker{font-family:var(--font-interface);font-size:.68rem;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--rust-deep);margin-bottom:4px;}
.team-report h3{font-size:1.12rem;margin:0 0 8px;}
.team-report .tr-source{display:inline-block;background:var(--sky);color:var(--leaf-deep);border-radius:14px;padding:3px 9px;margin:0 0 9px;font-family:var(--font-interface);font-size:.7rem;font-weight:800;}

/* ---------- Dashboard (Screen 5B) ---------- */
.dash-controls{display:flex;gap:16px;flex-wrap:wrap;margin:4px 0 16px;}
.dash-group legend{font-family:var(--font-interface);font-weight:800;font-size:.76rem;letter-spacing:.6px;text-transform:uppercase;color:var(--leaf-deep);margin-bottom:6px;padding:0;}

.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{background:var(--birch-card);border:1px solid #d7ddd3;border-radius:20px;padding:8px 15px;font-family:var(--font-interface);font-weight:700;font-size:.85rem;color:var(--charcoal);min-height:40px;}
.chip.active{background:var(--leaf);border-color:var(--leaf);color:#fff;}

.chart-wrap{background:var(--birch-card);border-radius:14px;padding:16px;box-shadow:var(--shadow-sm);margin-bottom:16px;}
.chart-legend{display:flex;gap:22px;flex-wrap:wrap;margin:12px 0 4px;font-size:1rem;font-weight:700;}

.var-note{margin-top:10px;}
.tracker{background:var(--birch-card);border-bottom:1px solid #e6e0cf;padding:12px 16px;}

.tracker-step{display:flex;align-items:flex-start;gap:10px;background:var(--sky);border-radius:12px;padding:10px 12px;}
.tracker-step .ts-num{background:#d8e5dd;color:var(--leaf-deep);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-interface);font-weight:800;font-size:.82rem;flex:none;}
.tracker-step.done .ts-num{background:var(--leaf);color:#fff;}
.tracker-step .ts-label{font-family:var(--font-interface);font-weight:800;font-size:.68rem;letter-spacing:.7px;text-transform:uppercase;color:#6d7d70;}
.tracker-step .ts-value{font-size:.88rem;color:var(--charcoal);font-style:italic;}
.tracker-step.done .ts-value{font-style:normal;font-weight:700;color:var(--leaf-deep);}
.tracker-step.soon{opacity:.7;}
@media(max-width:600px){.tracker-inner{grid-template-columns:1fr;}}
.done-badges{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px;}
.vbadge{font-size:.72rem;font-weight:800;padding:4px 10px;border-radius:14px;background:#eee7d4;color:#8a7d5c;}
.vbadge.done{background:var(--moss);color:#fff;}

.img-placeholder{background:repeating-linear-gradient(45deg,#F2ECDC,#F2ECDC 10px,#E9E1C8 10px,#E9E1C8 20px);border:2px dashed #C9BFA0;display:flex !important;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;padding:12px;}
.img-placeholder .ip-icon{font-size:1.7rem;line-height:1;}

.img-placeholder .ip-path{font-family:'Courier New',monospace;font-size:.66rem;color:#a89b78;word-break:break-all;padding:0 6px;max-width:100%;}
.narrative-line{font-size:1.02rem;line-height:1.55;color:var(--charcoal);margin:0 0 16px;}
.scene-duo{display:flex;gap:16px;align-items:center;margin:0 0 16px;}
.scene-duo .duo-img{flex:0 0 49%;max-width:286px;}
.scene-duo .duo-img img,.scene-duo .duo-img .img-placeholder{width:100%;display:block;border-radius:14px;box-shadow:var(--shadow-sm);margin:0;}
.scene-duo .duo-text{flex:1;min-width:0;}

@media(max-width:640px){.scene-duo{flex-direction:column;}.scene-duo .duo-img{flex:none;width:90%;max-width:338px;}}
.email-compose{background:var(--birch-card);border:1px solid #e3ddc9;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);margin:0 0 4px;}
.email-compose .ec-head{background:var(--sky);padding:12px 16px;font-size:.85rem;color:#4b564e;}
.email-compose .ec-row{display:flex;gap:8px;margin:2px 0;}
.email-compose .ec-label{font-weight:800;color:var(--leaf-deep);min-width:46px;}

.email-compose .ec-body{width:100%;border:none;padding:14px 16px;min-height:130px;font-family:var(--font-body);font-size:.92rem;resize:vertical;color:var(--charcoal);border-radius:0;}
.email-compose .ec-subject:focus,.email-compose .ec-body:focus{outline:2px solid var(--rust);outline-offset:-2px;}

.navbar{position:static;background:var(--birch-card);border-top:1px solid #e6e0cf;padding:10px 16px 18px;display:flex;justify-content:center;}
.navbar-inner{max-width:728px;margin:0 auto;width:100%;display:flex;justify-content:space-between;align-items:center;}

<body>

<header class="app-header" role="banner">
  <div class="app-header-inner">
    <div class="brand">
      <span class="sis">Stories in Science</span>
      <span class="grade">Grade 5 &middot; Life Science</span>
    </div>
    <div class="header-title" id="headerTitle" aria-live="polite">Launch</div>
    <div class="header-actions">
      <button class="hbtn" id="glossaryBtn">Glossary</button>
      <button class="hbtn" id="journalBtn">Journal</button>
      <button class="hbtn" id="restartBtn">Restart</button>
    </div>
  </div>
</header>

<div class="tracker hidden" id="tracker"></div>
<main id="stage" role="main"></main>
<nav class="navbar hidden" id="navbar"><div class="navbar-inner"><button id="backBtn" aria-label="Go back">&larr; Back</button><button id="continueBtn" disabled>Continue</button></div></nav>
<div id="modalRoot"></div>

<script>
/* ===================== Helpers ===================== */
function $(sel,root){return (root||document).querySelector(sel);}
function $$(sel,root){return Array.from((root||document).querySelectorAll(sel));}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function imgFallback(img){
  const src=img.getAttribute("src")||"";
  const div=document.createElement("div");
  div.className=img.className+" img-placeholder";
  if(img.style&&img.style.cssText)div.style.cssText=img.style.cssText;
  div.innerHTML=`<span class="ip-icon" aria-hidden="true">&#128444;&#65039;</span><span class="ip-label">Image pending</span><span class="ip-path">${esc(src)}</span>`;
  img.replaceWith(div);
}
function nowISO(){return new Date().toISOString();}
function fmtDate(iso){if(!iso)return "—";const d=new Date(iso);return d.toLocaleString();}
/* ---------- Read-aloud ---------- */
function ttsButton(text){
  return `<button class="tts-btn" type="button" data-tts="${esc(text)}">&#128266; <span class="tts-label">Read aloud</span></button>`;
}
document.addEventListener("click",e=>{
  const btn=e.target.closest("[data-tts]");
  if(!btn)return;
  if(typeof window.speechSynthesis==="undefined")return;
  const label=btn.querySelector(".tts-label");
  if(window.speechSynthesis.speaking){
    window.speechSynthesis.cancel();
    if(label)label.textContent="Read aloud";
    return;
  }
  const utter=new SpeechSynthesisUtterance(btn.dataset.tts);
  utter.rate=0.95;
  utter.onend=()=>{if(label)label.textContent="Read aloud";};
  utter.onerror=()=>{if(label)label.textContent="Read aloud";};
  if(label)label.textContent="Stop";
  window.speechSynthesis.speak(utter);
});

const LS_KEY="ridge_foxinvestigation_v1";
function defaultState(){
  return {
    meta:{lessonTitle:"The Fox at Recess: A Ridge Den Investigation",lessonVersion:"0.4-dp2-interactives",standard:"AZ 5.L3U1.10",studentLabel:"",sessionCode:"",startedAt:"",lastSavedAt:""},
    navigation:{currentScreen:1,firstPath:"",secondPath:""},
    progress:{visitedScreens:[1]},
    entry:{playgroundNote:"",homeNote:"",emailSubject:"Fox sighting near playground fence",emailBody:"",mapObservation:"",assignmentAccepted:false},
    firstInvestigation:{
      gallery:{photosViewed:[],patternNote:"",limitationNote:""},
      dashboard:{variablesViewed:[],lengthNote:"",massNote:"",conditionNote:"",compareDen:"Meadow Den",claim:""},
      convergence:{combinedClaim:""}
    },
    secondInvestigation:{
      habitat:{yearsViewed:[],teamNote:"",selectedYear:2022},
      food:{selectedHotspots:[],foundCorrect:[],viewedRecords:[],teamNote:""}
    }
  };
}
let state=null;
function save(){try{state.meta.lastSavedAt=nowISO();localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
function load(){try{const raw=localStorage.getItem(LS_KEY);if(raw)return JSON.parse(raw);}catch(e){}return null;}
function hasSave(){try{return !!localStorage.getItem(LS_KEY);}catch(e){return false;}}
function getSessionCode(){
  if(!state.meta.sessionCode){
    const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="";
    for(let i=0;i<6;i++)c+=A.charAt(Math.floor(Math.random()*A.length));
    state.meta.sessionCode=c;try{save();}catch(e){}
  }
  return state.meta.sessionCode;
}
function getPath(p){return p.split(".").reduce((o,k)=>(o==null?o:o[k]),state);}
function setPath(p,val){
  const parts=p.split(".");let o=state;
  for(let i=0;i<parts.length-1;i++)o=o[parts[i]];
  o[parts[parts.length-1]]=val;save();
}
function textField(id,label,path,placeholder){
  const cur=getPath(path)||"";
  return `<label class="field-label" for="${id}">${esc(label)}</label>
    <textarea id="${id}" data-path="${path}" placeholder="${esc(placeholder||"")}">${esc(cur)}</textarea>`;
}
function autoBindAll(root){
  $$("textarea[data-path],input[data-path]",root).forEach(el=>{
    el.addEventListener("input",()=>setPath(el.dataset.path,el.value));
  });
}
function promptBox(q){return `<span class="prompt-box">${esc(q)}</span>`;}
function imageBlock(src,alt){return `<img class="img-block" src="${src}" alt="${esc(alt||"")}" style="width:100%;min-height:208px;border-radius:11px;display:block;margin:0 0 8px;object-fit:cover;" onerror="imgFallback(this)">`;}

/* ---------- Narrative helpers ---------- */
function scene(o){
  const media=o.img?`<img class="scene-media" src="${o.img}" alt="${esc(o.alt||"")}" onerror="imgFallback(this)">`:"";
  const hud=o.hud?`<div class="hud"><span class="bracket tl"></span><span class="bracket tr"></span></div>${o.hudTag?`<span class="hud-tag">${esc(o.hudTag)}</span>`:""}`:"";
  return `<div class="scene">${media}${hud}<div class="scene-copy">
    ${o.stamp?`<span class="stamp">${esc(o.stamp)}</span>`:""}
    <h2>${esc(o.title)}</h2>
    ${o.sub?`<p class="scene-sub">${esc(o.sub)}</p>`:""}
  </div></div>`;
}
function speak(nameHtml,lines,verb){
  const L=Array.isArray(lines)?lines:[lines];
  let html=`<p class="dialogue"><span class="sp">${nameHtml}</span> ${esc(verb||"says")}: &ldquo;${esc(L[0])}&rdquo;</p>`;
  for(let i=1;i<L.length;i++)html+=`<p class="dialogue">&ldquo;${esc(L[i])}&rdquo;</p>`;
  return html;
}
function reed(lines){return speak("Dr. Reed",lines);}
function alvarez(lines){return speak("Mr. Alvarez",lines);}
function dialogue(){return `<div class="dialogue-block">${[].slice.call(arguments).join("")}</div>`;}
function caseFile(tab,html){return `<div class="case-file"><span class="file-tab">${esc(tab)}</span>${html}</div>`;}
function alertPanel(html){return `<div class="alert-panel">${html}</div>`;}

/* ===================== Screen router ===================== */
const SCREENS={};
function registerScreen(n,def){SCREENS[n]=def;}
function setContinue(ok){
  const b=$("#continueBtn");
  if(b)b.disabled=!ok;
}
function updateHeader(){
  const n=state.navigation.currentScreen;
  const def=SCREENS[n];
  $("#headerTitle").textContent=(n===1)?"":(def&&def.title?def.title:("Screen "+n));
  const nav=$("#navbar");
  nav.classList.toggle("hidden",n===1);
  document.body.classList.toggle("has-navbar",n!==1);
  const backBtn=$("#backBtn");
  if(backBtn)backBtn.style.visibility=(n===1)?"hidden":"visible";
  const contBtn=$("#continueBtn");
  if(contBtn)contBtn.style.display=(def&&def.hideNav)?"none":"";
  updateTracker(n);
}
function updateTracker(n){
  const t=$("#tracker");
  if(!t)return;
  t.classList.toggle("hidden",n===1);
  if(n===1)return;
  const p=state.navigation.firstPath;
  const p2=state.navigation.secondPath;
  const step1Done=!!p;
  const step1Value=p==="gallery"?"Study the Sightings":p==="dashboard"?"Study the Numbers":"Awaiting your choice…";
  const step2Done=!!p2;
  const step2Value=p2==="habitat"?"Track the Changing Habitat":p2==="food"?"Follow the Food Trail":((n===10||n===11)?"Awaiting your choice…":"Coming soon");
  const step2Class=step2Done?"done":((n===10||n===11||n==="12A"||n==="12B")?"":"soon");
  t.innerHTML=`<div class="tracker-inner">
    <div class="tracker-step ${step1Done?"done":""}"><span class="ts-num">${step1Done?"&#10003;":"1"}</span><div><div class="ts-label">Evidence Path</div><div class="ts-value">${esc(step1Value)}</div></div></div>
    <div class="tracker-step ${step2Class}"><span class="ts-num">${step2Done?"&#10003;":"2"}</span><div><div class="ts-label">Deeper Investigation</div><div class="ts-value">${esc(step2Value)}</div></div></div>
  </div>`;
}
function renderCurrent(){
  const n=state.navigation.currentScreen;
  const def=SCREENS[n];
  const stage=$("#stage");
  if(!def){stage.innerHTML="<p>Screen not found.</p>";return;}
  stage.innerHTML=def.render();
  updateHeader();
  setContinue(true);
  if(def.init)def.init(stage);
}
function goToScreen(n){
  if(n==="8A"&&state.navigation.firstPath!=="gallery")n=7;
  if(n==="8B"&&state.navigation.firstPath!=="dashboard")n=7;
  if((n===9||n===10||n===11||n==="12A"||n==="12B")&&!state.navigation.firstPath)n=7;
  if(n==="12A"&&state.navigation.secondPath!=="habitat")n=11;
  if(n==="12B"&&state.navigation.secondPath!=="food")n=11;
  $("#modalRoot").innerHTML="";
  document.removeEventListener("keydown",escClose);
  document.removeEventListener("keydown",escCloseDrawer);
  state.navigation.currentScreen=n;
  if(!state.progress)state.progress={visitedScreens:[]};
  if(!state.progress.visitedScreens.includes(n))state.progress.visitedScreens.push(n);
  save();renderCurrent();
  window.scrollTo({top:0,behavior:(matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth")});
}
const NUMERIC_ORDER=[1,2,3,4,5,6,7];
function nextScreen(){
  const n=state.navigation.currentScreen;
  if(n===9){goToScreen(10);return;}
  if(n===10){goToScreen(11);return;}
  const i=NUMERIC_ORDER.indexOf(n);
  if(i>-1 && i<NUMERIC_ORDER.length-1)goToScreen(NUMERIC_ORDER[i+1]);
}
function prevScreen(){
  const n=state.navigation.currentScreen;
  if(n==="12A"||n==="12B"){goToScreen(11);return;}
  if(n===11){goToScreen(10);return;}
  if(n===10){goToScreen(9);return;}
  if(n===9){
    if(state.navigation.firstPath==="gallery")goToScreen("8A");
    else if(state.navigation.firstPath==="dashboard")goToScreen("8B");
    else goToScreen(7);
    return;
  }
  if(n==="8A"||n==="8B"){goToScreen(7);return;}
  const i=NUMERIC_ORDER.indexOf(n);
  if(i>0)goToScreen(NUMERIC_ORDER[i-1]);
}
$("#continueBtn").addEventListener("click",nextScreen);

/* ---------- Slide-out drawer (Glossary = left, Journal = right) ---------- */
let drawerLastFocus=null;
function openDrawer(side,titleText,bodyHtml){
  const root=$("#modalRoot");
  drawerLastFocus=document.activeElement;
  root.innerHTML=`<div class="drawer-overlay" id="drOverlay"></div>
    <div class="drawer ${side}" id="drPanel" role="dialog" aria-modal="true" aria-label="${esc(titleText)}">
      <div class="drawer-head"><h2>${esc(titleText)}</h2><button class="drawer-close" id="drClose" aria-label="Close">&times;</button></div>
      <div class="drawer-body">${bodyHtml}</div>
    </div>`;
  $("#drOverlay",root).addEventListener("click",closeDrawer);
  $("#drClose",root).addEventListener("click",closeDrawer);
  document.addEventListener("keydown",escCloseDrawer);
  requestAnimationFrame(()=>{$("#drPanel",root).classList.add("open");});
}
function escCloseDrawer(e){if(e.key==="Escape")closeDrawer();}
function closeDrawer(){
  const panel=$("#drPanel");
  if(!panel){$("#modalRoot").innerHTML="";return;}
  panel.classList.remove("open");
  document.removeEventListener("keydown",escCloseDrawer);
  setTimeout(()=>{$("#modalRoot").innerHTML="";},200);
  if(drawerLastFocus&&drawerLastFocus.focus)drawerLastFocus.focus();
}

function chartSVG(dens,varKey){
  const V=VARIABLES[varKey];
  const W=580,H=280,padL=46,padR=16,padT=22,padB=34;
  const x=i=>padL+(i/(YEARS.length-1))*(W-padL-padR);
  const y=v=>H-padB-((v-V.yMin)/(V.yMax-V.yMin))*(H-padT-padB);
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(V.label)} by year" style="width:100%;height:auto;font-family:var(--font-body),sans-serif;">`;
  const gridSteps=4;
  for(let s=0;s<=gridSteps;s++){
    const v=V.yMin+(V.yMax-V.yMin)*(s/gridSteps);
    svg+=`<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="#e8e1cc" stroke-width="1"/>`;
    svg+=`<text x="${padL-8}" y="${y(v)+4}" font-size="11" fill="#7a715c" text-anchor="end">${Math.round(v*10)/10}</text>`;
  }
  YEARS.forEach((yr,i)=>{
    svg+=`<line x1="${x(i)}" y1="${padT}" x2="${x(i)}" y2="${H-padB}" stroke="#f0ebd9" stroke-width="1"/>`;
    svg+=`<text x="${x(i)}" y="${H-padB+20}" font-size="12" fill="#5c6a5f" text-anchor="middle" font-weight="600">${yr}</text>`;
  });
  svg+=`<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#cfc9b4" stroke-width="1.5"/>`;
  dens.forEach((den,di)=>{
    const data=V.data[den];const color=DEN_COLOR[den];
    const labelAbove=di===0;
    let pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
    svg+=`<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    data.forEach((v,i)=>{
      svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="5.5" fill="${color}" stroke="#fff" stroke-width="1.5"><title>${esc(den)} — ${YEARS[i]}: ${v} ${esc(V.unit)}</title></circle>`;
      svg+=`<text x="${x(i)}" y="${y(v)+(labelAbove?-11:18)}" font-size="12.5" font-weight="800" fill="${color}" text-anchor="middle">${v}</text>`;
    });
  });
  svg+="</svg>";
  return svg;
}

  {id:"birdseed",number:4,x:38,y:35,label:"Spilled birdseed",correct:true,feedback:"Spilled seed can attract small animals and leave food on the ground, which may draw foxes to the area."},
  {id:"bicycle",number:5,x:55,y:73,label:"Bicycle",correct:false,feedback:"A bicycle may be part of the neighborhood scene, but it does not provide food for a fox."},
  {id:"hose",number:6,x:28,y:82,label:"Garden hose",correct:false,feedback:"A garden hose is not a food source, although water nearby could still be part of the environment."},
  {id:"flower-pot",number:7,x:66,y:41,label:"Flower pot",correct:false,feedback:"The flower pot itself does not provide the kind of food evidence this team is investigating."},
  {id:"toy",number:8,x:48,y:59,label:"Outdoor toy",correct:false,feedback:"An outdoor toy is not likely to attract a fox as a food source."}
];
const FOOD_CORRECT_IDS=FOOD_HOTSPOTS.filter(h=>h.correct).map(h=>h.id);
const FOOD_RECORDS=[
  {id:"record-1",img:"images/food-trail-camera-1.png",title:"Follow-Up Record 1",note:"A fox was captured near a Ridge Trail porch and outdoor bowl at night."},
  {id:"record-2",img:"images/food-trail-camera-2.png",title:"Follow-Up Record 2",note:"Another camera record from the same area shows a fox returning again later."}
];

/* ===================== Screen 12A — Habitat Timeline ===================== */
registerScreen("12A",{title:"Track the Changing Habitat",hideNav:true,
  render(){
    const habitat=state.secondInvestigation.habitat;
    const selected=HABITAT_YEARS.includes(Number(habitat.selectedYear))?Number(habitat.selectedYear):2022;
    const allViewed=HABITAT_YEARS.every(y=>habitat.yearsViewed.includes(y));
    return `<div class="screen">
      ${scene({stamp:"Habitat Team",title:"Track the Changing Habitat",sub:"How did the area around Ridge Den change?"})}
      <div class="card">
        <p class="narrative-line">Gracie joins the Habitat Team. Nick opens the Food Trail file.</p>
        <p class="narrative-line">The Habitat Team begins by comparing maps of the Ridge Den area across five years. Dr. Reed wants the team to investigate how the land around the den has changed over time.</p>
        ${dialogue(alvarez("Look carefully across the years. Focus on what changes around Ridge Den and how those changes might affect the foxes' habitat."))}
      </div>
      <section class="timeline-shell" aria-labelledby="habitatTimelineTitle">
        <div class="timeline-top">
          <div><div class="sect-label" style="margin:0 0 3px">Habitat timeline</div><h2 class="timeline-year-label" id="habitatTimelineTitle">Year <span id="habitatYearLabel">${selected}</span></h2></div>
          <span class="timeline-progress" id="habitatProgress">${habitat.yearsViewed.length} of 5 years viewed</span>
        </div>
        <div class="timeline-image-wrap" id="habitatImageWrap"></div>
        <div class="timeline-controls">
          <label class="field-label" for="habitatRange">Move through the timeline</label>
          <input class="timeline-range" id="habitatRange" type="range" min="2022" max="2026" step="1" value="${selected}" aria-valuemin="2022" aria-valuemax="2026" aria-valuenow="${selected}">
          <div class="timeline-years" id="habitatYearButtons">
            ${HABITAT_YEARS.map(y=>`<button type="button" class="timeline-year-btn ${y===selected?"active":""} ${habitat.yearsViewed.includes(y)?"viewed":""}" data-year="${y}" aria-pressed="${y===selected}">${y}</button>`).join("")}
          </div>
        </div>
        <div class="timeline-look"><strong>What to look for:</strong><ul><li>forest cover</li><li>cleared land</li><li>roads and houses</li><li>distance from Ridge Den</li></ul></div>
      </section>
      <div id="habitatReveal" class="card ${allViewed?"":"hidden"}">
        <p class="narrative-line">Gracie studies the 2022 and 2026 maps again.</p>
        ${dialogue(
          speak("Gracie","The area around Ridge Den does not look the same anymore."),
          alvarez("Then your team should describe what changed in the habitat and how that could affect the foxes.")
        )}
        <h2>Habitat Team Note</h2>
        ${promptBox("What changed in the habitat around Ridge Den from 2022 to 2026, and how could those changes affect where the foxes travel or find natural food? Use at least two pieces of evidence from the timeline.")}
        ${textField("habitat_team_note","Your Habitat Team note","secondInvestigation.habitat.teamNote","Use evidence from at least two years.")}
        <div class="dp2-complete">Your Habitat Team note is saved. The class will compare this evidence with the Food Access Team's findings in the next section.</div>
      </div>
    </div>`;
  },
  init(root){
    const habitat=state.secondInvestigation.habitat;
    const wrap=$("#habitatImageWrap",root);
    function renderYear(year){
      year=Number(year);
      habitat.selectedYear=year;
      if(!habitat.yearsViewed.includes(year))habitat.yearsViewed.push(year);
      save();
      wrap.innerHTML=`<img src="${HABITAT_IMAGES[year]}" alt="Illustrated view of the Ridge Den habitat in ${year}." onerror="imgFallback(this)">`;
      $("#habitatYearLabel",root).textContent=year;
      const range=$("#habitatRange",root);range.value=year;range.setAttribute("aria-valuenow",year);
      $$(".timeline-year-btn",root).forEach(btn=>{
        const y=Number(btn.dataset.year);
        btn.classList.toggle("active",y===year);
        btn.classList.toggle("viewed",habitat.yearsViewed.includes(y));
        btn.setAttribute("aria-pressed",String(y===year));
      });
      $("#habitatProgress",root).textContent=`${habitat.yearsViewed.length} of 5 years viewed`;
      if(HABITAT_YEARS.every(y=>habitat.yearsViewed.includes(y)))$("#habitatReveal",root).classList.remove("hidden");
    }
    $("#habitatRange",root).addEventListener("input",e=>renderYear(e.target.value));
    $$(".timeline-year-btn",root).forEach(btn=>btn.addEventListener("click",()=>renderYear(btn.dataset.year)));
    autoBindAll(root);
    renderYear(habitat.selectedYear||2022);
  }
});

/* ===================== Screen 12B — Food Source Identifier ===================== */
registerScreen("12B",{title:"Follow the Food Trail",hideNav:true,
  render(){
    const food=state.secondInvestigation.food;
    const allClues=FOOD_CORRECT_IDS.every(id=>food.foundCorrect.includes(id));
    const allRecords=FOOD_RECORDS.every(r=>food.viewedRecords.includes(r.id));
    return `<div class="screen">
      ${scene({stamp:"Food Access Team",title:"Follow the Food Trail",sub:"What might draw foxes toward homes?"})}
      <div class="card">
        <p class="narrative-line">Gracie joins the Food Access Team. Nick opens the Habitat file.</p>
        <p class="narrative-line">The Food Access Team begins by examining a Ridge Trail neighborhood scene. Dr. Reed wants the team to investigate what food sources might be attracting foxes near homes.</p>
        ${dialogue(alvarez("Identify which items in the scene could provide food or attract a fox. Then examine the follow-up records to see whether foxes may be returning."))}
      </div>
      <div class="card">
        <h2>Search the Ridge Trail Scene</h2>
        <p class="narrative-line">Select the numbered locations. Find all four clues that could make food available to foxes.</p>
        <div class="identifier-wrap" id="foodScene">
          <img src="images/food-trail-scene.png" alt="A Ridge Trail yard and porch scene with possible food sources and ordinary outdoor objects." onerror="imgFallback(this)">
          ${FOOD_HOTSPOTS.map(h=>`<button type="button" class="clue-hotspot ${food.foundCorrect.includes(h.id)?"selected-correct":food.selectedHotspots.includes(h.id)?"selected-distractor":""}" style="left:${h.x}%;top:${h.y}%" data-hotspot="${h.id}" aria-label="Examine location ${h.number}" aria-pressed="${food.selectedHotspots.includes(h.id)}">${h.number}</button>`).join("")}
        </div>
        <div class="identifier-status"><span class="identifier-count" id="foodClueCount">${food.foundCorrect.length} of 4 food clues found</span><span class="small muted">Not every numbered item is a food clue.</span></div>
        <div class="identifier-feedback" id="foodFeedback" aria-live="polite"><p class="mi-empty" style="margin:0">Select a numbered location to examine it.</p></div>
      </div>
      <div id="foodFollowup" class="card ${allClues?"":"hidden"}">
        <h2>Follow-Up Records</h2>
        <p class="narrative-line">The team found possible food sources. Now open both camera records to check whether foxes returned to the area.</p>
        <div class="food-record-grid">
          ${FOOD_RECORDS.map(r=>`<button type="button" class="food-record ${food.viewedRecords.includes(r.id)?"viewed":""}" data-record="${r.id}" aria-pressed="${food.viewedRecords.includes(r.id)}">
            <img src="${r.img}" alt="${esc(r.title)} from a Ridge Trail porch camera." onerror="imgFallback(this)">
            <span class="food-record-copy"><strong>${esc(r.title)}</strong><span>${food.viewedRecords.includes(r.id)?"Viewed ✓":"Open record"}</span></span>
          </button>`).join("")}
        </div>
        <div class="food-record-detail" id="foodRecordDetail" aria-live="polite">Open a record to read the camera note.</div>
      </div>
      <div id="foodReveal" class="card ${allClues&&allRecords?"":"hidden"}">
        ${dialogue(
          speak("Gracie","If food is easy to find near homes, the foxes might keep coming back."),
          alvarez("Then your team should explain what evidence suggests food near homes could affect where the foxes go and how often they return.")
        )}
        <h2>Food Access Team Note</h2>
        ${promptBox("What evidence suggests that food near Ridge Trail homes could affect where the foxes go and how often they return? Use at least two pieces of evidence.")}
        ${textField("food_team_note","Your Food Access Team note","secondInvestigation.food.teamNote","Use evidence from the scene and camera records.")}
        <div class="dp2-complete">Your Food Access Team note is saved. The class will compare this evidence with the Habitat Team's findings in the next section.</div>
      </div>
    </div>`;
  },
  init(root){
    const food=state.secondInvestigation.food;
    function refreshClueProgress(){
      $("#foodClueCount",root).textContent=`${food.foundCorrect.length} of 4 food clues found`;
      if(FOOD_CORRECT_IDS.every(id=>food.foundCorrect.includes(id)))$("#foodFollowup",root).classList.remove("hidden");
    }
    $$(".clue-hotspot",root).forEach(btn=>btn.addEventListener("click",()=>{
      const clue=FOOD_HOTSPOTS.find(h=>h.id===btn.dataset.hotspot);
      if(!food.selectedHotspots.includes(clue.id))food.selectedHotspots.push(clue.id);
      if(clue.correct&&!food.foundCorrect.includes(clue.id))food.foundCorrect.push(clue.id);
      save();
      btn.setAttribute("aria-pressed","true");
      btn.classList.toggle("selected-correct",clue.correct);
      btn.classList.toggle("selected-distractor",!clue.correct);
      const panel=$("#foodFeedback",root);
      panel.classList.toggle("correct",clue.correct);
      panel.innerHTML=`<div class="if-title">${clue.correct?"Food clue found":"Not a food clue"}: ${esc(clue.label)}</div><p style="margin:0">${esc(clue.feedback)}</p>`;
      refreshClueProgress();
    }));
    $$(".food-record",root).forEach(btn=>btn.addEventListener("click",()=>{
      const record=FOOD_RECORDS.find(r=>r.id===btn.dataset.record);
      if(!food.viewedRecords.includes(record.id))food.viewedRecords.push(record.id);
      save();
      btn.classList.add("viewed");
      btn.setAttribute("aria-pressed","true");
      const copy=$(".food-record-copy span",btn);if(copy)copy.textContent="Viewed ✓";
      $("#foodRecordDetail",root).innerHTML=`<strong>${esc(record.title)}</strong><p style="margin:4px 0 0">${esc(record.note)}</p>`;
      if(FOOD_RECORDS.every(r=>food.viewedRecords.includes(r.id)))$("#foodReveal",root).classList.remove("hidden");
    }));
    autoBindAll(root);
    refreshClueProgress();
  }
});

/* ===================== Boot ===================== */
function normalizeState(){
  if(!state.entry)state.entry={};
  if(typeof state.entry.mapObservation!=="string")state.entry.mapObservation="";
  if(!state.navigation)state.navigation={currentScreen:1,firstPath:"",secondPath:""};
  if(typeof state.navigation.secondPath!=="string")state.navigation.secondPath="";
  if(!state.firstInvestigation)state.firstInvestigation={};
  if(!state.firstInvestigation.gallery)state.firstInvestigation.gallery={photosViewed:[],patternNote:"",limitationNote:""};
  if(!Array.isArray(state.firstInvestigation.gallery.photosViewed))state.firstInvestigation.gallery.photosViewed=[];
  if(typeof state.firstInvestigation.gallery.patternNote!=="string")state.firstInvestigation.gallery.patternNote="";
  if(!state.firstInvestigation.dashboard)state.firstInvestigation.dashboard={variablesViewed:[],lengthNote:"",massNote:"",conditionNote:"",compareDen:"Meadow Den",claim:""};
  if(!Array.isArray(state.firstInvestigation.dashboard.variablesViewed))state.firstInvestigation.dashboard.variablesViewed=[];
  if(typeof state.firstInvestigation.dashboard.claim!=="string")state.firstInvestigation.dashboard.claim="";
  if(!state.firstInvestigation.convergence)state.firstInvestigation.convergence={combinedClaim:""};
  if(typeof state.firstInvestigation.convergence.combinedClaim!=="string")state.firstInvestigation.convergence.combinedClaim="";
  if(!state.secondInvestigation)state.secondInvestigation={};
  if(!state.secondInvestigation.habitat)state.secondInvestigation.habitat={yearsViewed:[],teamNote:"",selectedYear:2022};
  if(!Array.isArray(state.secondInvestigation.habitat.yearsViewed))state.secondInvestigation.habitat.yearsViewed=[];
  state.secondInvestigation.habitat.yearsViewed=state.secondInvestigation.habitat.yearsViewed.map(Number).filter(y=>HABITAT_YEARS.includes(y));
  if(typeof state.secondInvestigation.habitat.teamNote!=="string")state.secondInvestigation.habitat.teamNote="";
  if(!HABITAT_YEARS.includes(Number(state.secondInvestigation.habitat.selectedYear)))state.secondInvestigation.habitat.selectedYear=2022;
  else state.secondInvestigation.habitat.selectedYear=Number(state.secondInvestigation.habitat.selectedYear);
  if(!state.secondInvestigation.food)state.secondInvestigation.food={selectedHotspots:[],foundCorrect:[],viewedRecords:[],teamNote:""};
  if(!Array.isArray(state.secondInvestigation.food.selectedHotspots))state.secondInvestigation.food.selectedHotspots=[];
  if(!Array.isArray(state.secondInvestigation.food.foundCorrect))state.secondInvestigation.food.foundCorrect=[];
  if(!Array.isArray(state.secondInvestigation.food.viewedRecords))state.secondInvestigation.food.viewedRecords=[];
  if(typeof state.secondInvestigation.food.teamNote!=="string")state.secondInvestigation.food.teamNote="";
  if(!state.progress)state.progress={visitedScreens:[]};
  if(!Array.isArray(state.progress.visitedScreens))state.progress.visitedScreens=[];
  /* Migrate legacy screen keys from before the map + Decision Point 1 restructure. */
  if(state.navigation.currentScreen==="6A"){
    state.navigation.currentScreen=(state.navigation.firstPath==="gallery")?"8A":7;
  }else if(state.navigation.currentScreen==="6B"){
    state.navigation.currentScreen=(state.navigation.firstPath==="dashboard")?"8B":7;
  }
  const n=state.navigation.currentScreen;
  if(n==="8A"&&state.navigation.firstPath!=="gallery")state.navigation.currentScreen=7;
  if(n==="8B"&&state.navigation.firstPath!=="dashboard")state.navigation.currentScreen=7;
  if((n===9||n===10||n===11||n==="12A"||n==="12B")&&!state.navigation.firstPath)state.navigation.currentScreen=7;
  if(n==="12A"&&state.navigation.secondPath!=="habitat")state.navigation.currentScreen=11;
  if(n==="12B"&&state.navigation.secondPath!=="food")state.navigation.currentScreen=11;
}
function boot(){
  state=load()||defaultState();
  normalizeState();
  if(!SCREENS[state.navigation.currentScreen])state.navigation.currentScreen=1;
  if(!state.progress.visitedScreens.includes(state.navigation.currentScreen))state.progress.visitedScreens.push(state.navigation.currentScreen);
  save();
  renderCurrent();
}
$("#glossaryBtn").addEventListener("click",openGlossary);
$("#journalBtn").addEventListener("click",openJournal);
$("#restartBtn").addEventListener("click",()=>{
  if(confirm("Restart the investigation? This clears your saved progress.")){
    localStorage.removeItem(LS_KEY);state=defaultState();goToScreen(1);
  }
});
$("#backBtn").addEventListener("click",prevScreen);
boot();
</script>
