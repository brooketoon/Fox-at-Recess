<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Fox at Recess: A Ridge Den Investigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --leaf:#3E8C5C;
  --leaf-deep:#2C6B44;
  --rust:#E2703A;
  --rust-deep:#C25A28;
  --amber:#FFC94D;
  --birch:#FFFAF0;
  --birch-card:#FFFFFF;
  --moss:#7FAE6E;
  --sky:#EAF4EF;
  --charcoal:#2B2A26;
  --shadow-sm:0 1px 3px rgba(30,30,20,.08);
  --shadow-md:0 6px 18px rgba(30,30,20,.12);
  --font-title:"Fredoka","Baloo 2",system-ui,Arial,sans-serif;
  --font-interface:"Lexend","Segoe UI",Roboto,-apple-system,Arial,sans-serif;
  --font-body:"Lexend","Segoe UI",Roboto,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;font-size:18px;}
body{margin:0;background:var(--birch);color:var(--charcoal);font-family:var(--font-body);line-height:1.5;}
h1,h2,h3,h4{font-family:var(--font-title);color:var(--leaf-deep);line-height:1.12;margin:0 0 8px;}
p{margin:0 0 12px;}
button{font-family:var(--font-interface);cursor:pointer;}
a{color:var(--rust-deep);}
.hidden{display:none !important;}
:focus-visible{outline:3px solid var(--rust);outline-offset:2px;}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}

/* ---------- Header ---------- */
.app-header{position:sticky;top:0;z-index:40;background:var(--leaf-deep);border-bottom:3px solid var(--rust);}
.app-header-inner{max-width:1000px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{display:flex;flex-direction:column;line-height:1.2;}
.brand .sis{font-family:var(--font-interface);font-weight:800;font-size:.72rem;letter-spacing:1.1px;text-transform:uppercase;color:var(--amber);}
.brand .grade{font-family:var(--font-interface);font-size:.68rem;color:#b9c7bd;}
.header-title{font-family:var(--font-title);font-weight:600;color:#fff;font-size:1.05rem;flex:1;min-width:120px;}
.header-actions{display:flex;gap:8px;align-items:center;}
.hbtn{background:transparent;border:1px solid #3c5548;color:#dfe9e2;border-radius:9px;padding:7px 12px;font-size:.8rem;font-weight:700;min-height:38px;}
.hbtn:hover{background:#274438;}
#backBtn{background:transparent;border:none;color:var(--rust-deep);font-family:var(--font-interface);font-weight:700;font-size:.9rem;padding:9px 12px;min-height:44px;border-radius:22px;}
#backBtn:hover{background:var(--sky);}

/* ---------- Layout ---------- */
main{max-width:760px;margin:0 auto;padding:22px 16px 18px;}
.screen{animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.card{background:var(--birch-card);border-radius:16px;padding:18px 20px;margin:0 0 18px;box-shadow:var(--shadow-sm);}

/* ---------- Landing ---------- */
.landing-top{text-align:center;padding:6px 0 4px;}
.sis-badge{display:inline-block;background:var(--leaf);color:#fff;font-family:var(--font-interface);font-weight:800;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;padding:6px 14px;border-radius:20px;}
.landing-top .eyebrow{margin:10px 0 2px;font-family:var(--font-interface);font-size:.78rem;letter-spacing:1px;text-transform:uppercase;color:#7c8c81;}
.landing-top h1{font-size:2rem;}

.hero-frame{position:relative;border-radius:20px;overflow:hidden;margin:18px 0;box-shadow:var(--shadow-md);background:linear-gradient(160deg,var(--leaf-deep),var(--leaf));text-align:center;padding:28px 24px 30px;}
.hero-frame .hero-media-wrap{max-width:60%;margin:0 auto 14px;}
.hero-frame .hero-media{width:100%;border-radius:14px;display:block;box-shadow:var(--shadow-sm);}
.hero-frame .hero-media.img-placeholder{aspect-ratio:16/10;}
.hero-frame .hero-eyebrow{font-family:var(--font-interface);font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--amber);margin:0 0 8px;}
.hero-frame h1{color:#fff;font-size:1.9rem;margin:0 0 10px;}
.hero-frame .hero-lead{color:#e4ece6;font-size:1.05rem;max-width:560px;margin:0 auto 8px;}
.tts-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);color:#fff;font-family:var(--font-interface);font-weight:700;font-size:.78rem;border-radius:999px;padding:6px 15px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;margin:2px 0 14px;}
.tts-btn:hover{background:rgba(255,255,255,.22);}
.obj-num{background:var(--rust);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-interface);font-weight:800;font-size:.85rem;flex:none;margin-bottom:6px;}
.std-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:8px 0 4px;}
.std-col{background:var(--sky);border-radius:10px;padding:12px 14px;}
.std-col h4{font-size:.86rem;margin:0 0 6px;color:var(--leaf-deep);}
.std-col p{font-size:.85rem;margin:0;color:#4b564e;}
.framework-callout{background:#FDF3DC;border:1px solid #EBD693;border-radius:12px;padding:14px 16px;margin-top:16px;}
.framework-callout h4{font-size:.82rem;text-transform:uppercase;letter-spacing:.6px;color:#8a6a0f;margin:0 0 6px;}
.framework-callout p{margin:0;font-size:.9rem;color:#5c4d1e;}
@media(max-width:640px){
  .hero-frame .hero-media-wrap{max-width:88%;}
  .std-grid{grid-template-columns:1fr;}
}
.btn{border:none;border-radius:26px;font-family:var(--font-interface);font-weight:800;padding:13px 26px;font-size:1rem;min-height:48px;display:inline-flex;align-items:center;gap:8px;}
.btn-amber{background:var(--amber);color:#3a2c0e;box-shadow:0 3px 0 #b9852a;}
.btn-amber:disabled{background:#e6ddc4;color:#a89b78;box-shadow:none;cursor:not-allowed;}
.path-transition{background:var(--sky);border-radius:14px;padding:14px 16px;margin:0 0 14px;font-size:.94rem;color:#3d4a3f;}
.path-transition-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 8px;}
.path-transition-note{font-size:.78rem;color:#8a8270;font-style:italic;}
.btn-amber:hover{filter:brightness(1.04);}
.btn-rust{background:var(--rust-deep);color:#fff;box-shadow:0 3px 0 #6d3216;}
.btn-outline{background:transparent;border:2px solid var(--leaf);color:var(--leaf-deep);font-weight:800;border-radius:26px;padding:11px 22px;}
.btn-ghost{background:none;border:none;color:var(--rust-deep);font-weight:800;}

.about-lesson{background:var(--birch-card);border-radius:14px;box-shadow:var(--shadow-sm);margin:0 0 16px;overflow:hidden;}
.collapse-head{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;font-family:var(--font-interface);font-weight:800;color:var(--leaf-deep);}
.collapse-head::-webkit-details-marker{display:none;}
.collapse-body{padding:0 18px 18px;font-size:.92rem;color:#4b564e;}
.obj-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px;}
.obj-card{background:var(--sky);border-radius:10px;padding:12px 14px;font-size:.9rem;}
.obj-card p{margin:0;color:#3d4a3f;}
.sect-label{font-family:var(--font-interface);font-weight:800;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:var(--rust-deep);margin:14px 0 6px;}
.std-code{background:var(--leaf);color:#fff;border-radius:6px;padding:2px 8px;font-weight:800;font-size:.8rem;}

.name-setup{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:6px 0 4px;font-size:.85rem;color:#5c6a5f;}
.name-setup input{border:1px solid #d7ddd3;border-radius:9px;padding:8px 11px;font-family:var(--font-interface);font-size:.9rem;flex:1;min-width:160px;}
.utility-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:16px;padding-top:13px;border-top:1px solid #e6e0cf;font-family:var(--font-interface);font-size:.78rem;color:#948a72;}
.utility-row .u-sep{color:#d9d0b8;}
.utility-row button,.utility-row .u-code{background:none;border:none;padding:0;color:#948a72;font-weight:700;font-size:.78rem;min-height:auto;}
.utility-row button:hover{color:var(--rust-deep);text-decoration:underline;}
.landing-footer{text-align:center;font-size:.72rem;color:#a39c86;margin-top:16px;line-height:1.6;}

/* ---------- Trail-cam framed scene (signature device) ---------- */
.scene{position:relative;border-radius:18px;overflow:hidden;margin:0 0 18px;box-shadow:var(--shadow-md);background:linear-gradient(160deg,var(--leaf-deep),var(--leaf));}
.scene .scene-media{width:100%;height:273px;object-fit:cover;display:block;opacity:.9;}
.scene .scene-copy{padding:20px 22px 22px;color:#fff;}
.scene h2{color:#fff;font-size:1.5rem;margin:6px 0 4px;}
.scene .scene-sub{color:#dce9e0;font-size:.98rem;max-width:56ch;}
.scene .stamp{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-interface);font-size:.68rem;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);padding:4px 11px;border-radius:18px;}
.hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;}
.hud .bracket{width:20px;height:20px;border-color:var(--amber);border-style:solid;opacity:.85;}
.hud .bracket.tl{border-width:3px 0 0 3px;}
.hud .bracket.tr{border-width:3px 3px 0 0;}
.hud-tag{position:absolute;bottom:14px;right:16px;background:rgba(15,20,15,.55);color:#f0e6c8;font-family:'Courier New',monospace;font-size:.7rem;letter-spacing:.5px;padding:4px 9px;border-radius:5px;border:1px solid rgba(227,168,59,.4);}

/* ---------- Dialogue / voices ---------- */
.observation-block{background:var(--birch-card);border-left:4px solid var(--leaf);border-radius:12px;padding:14px 17px;margin:0 0 16px;box-shadow:var(--shadow-sm);}
.dialogue-block{background:var(--birch-card);border-left:4px solid var(--leaf);border-radius:12px;padding:14px 17px;margin:0 24px 16px;box-shadow:var(--shadow-sm);}
@media(max-width:640px){.dialogue-block{margin-left:18px;margin-right:18px;}}
.card>.dialogue-block:last-child{margin-bottom:0;}
.dialogue{font-size:1.02rem;line-height:1.55;margin:0 0 9px;}
.dialogue:last-child{margin-bottom:0;}
.dialogue .sp{color:var(--rust-deep);font-weight:800;}
.observation-emphasis{background:#F5F9F6;border:1px solid #D8E8DC;border-radius:9px;padding:10px 12px;margin:2px 0 4px;font-weight:500;}

/* ---------- Phone / group-chat panel ---------- */
.msg-panel{background:#4A4032;border-radius:16px;padding:16px 17px;margin:0 0 18px;box-shadow:var(--shadow-md);border:1px solid rgba(0,0,0,.15);}
.msg-panel .cam-head{display:flex;align-items:center;gap:8px;font-family:'Courier New',monospace;color:var(--amber);font-size:.78rem;letter-spacing:.6px;margin-bottom:10px;}
.msg-panel .cam-head .dot{width:8px;height:8px;border-radius:50%;background:#e14b3a;box-shadow:0 0 0 3px rgba(225,75,58,.25);}
.msg-panel .cam-photo{width:100%;border-radius:10px;display:block;margin-bottom:9px;}
.msg-panel .autolog{font-family:'Courier New',monospace;font-size:.76rem;color:#9fb0a5;background:#141c22;border-radius:7px;padding:8px 10px;margin-bottom:10px;}
.chat-bubble{background:#26323e;color:#e7eef0;border-radius:4px 14px 14px 14px;padding:9px 13px;margin:6px 0;max-width:80%;font-size:.94rem;}
.chat-bubble .who{display:block;font-size:.68rem;color:#7fa88f;font-weight:800;margin-bottom:2px;}

/* ---------- Corkboard / case file ---------- */
.case-file{background:#fbf3e2;border:1px solid #e8dcb8;border-left:6px solid var(--rust);border-radius:10px;padding:16px 18px;margin:0 0 18px;}
.case-file .file-tab{display:inline-block;background:var(--rust);color:#fff;font-family:var(--font-interface);font-weight:800;font-size:.68rem;letter-spacing:1px;text-transform:uppercase;padding:4px 12px;border-radius:6px;margin-bottom:9px;}
.alert-panel{background:#FDF0E4;border:1.5px solid var(--rust);border-radius:12px;padding:14px 17px;margin:0 0 18px;color:#7A3B15;font-size:.92rem;}
.alert-panel strong{color:var(--rust-deep);}

/* ---------- Prompts / fields ---------- */
.prompt-box{display:block;background:var(--sky);border-left:4px solid var(--moss);border-radius:8px;padding:10px 14px;margin:0 0 8px;font-weight:700;color:var(--leaf-deep);font-size:.95rem;}
.field-label{display:block;font-family:var(--font-interface);font-weight:800;font-size:.8rem;color:var(--leaf-deep);margin:4px 0 6px;}
textarea,input[type=text]{width:100%;border:1px solid #d7ddd3;border-radius:10px;padding:11px 13px;font-family:var(--font-body);font-size:.95rem;color:var(--charcoal);resize:vertical;min-height:70px;}
textarea:focus,input:focus{border-color:var(--rust);}

/* ---------- Reveal action ---------- */
.reveal-action{text-align:center;margin:6px 0 18px;}

/* ---------- Station choice ---------- */
.station-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.station-card{position:relative;text-align:left;background:var(--birch-card);border:1px solid #e3ddc9;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;padding:0;display:flex;flex-direction:column;height:100%;}
.station-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--rust);}
.station-card.selected{border:3px solid var(--leaf);box-shadow:0 0 0 3px rgba(62,140,92,.16),var(--shadow-md);transform:none;}
.station-card.selected .st-open{background:var(--leaf);color:#fff;box-shadow:none;}
.station-card .st-top{height:8px;background:linear-gradient(90deg,var(--leaf),var(--rust));flex:none;}
.station-card .st-body{padding:16px 16px 18px;display:flex;flex-direction:column;flex:1;}
.station-card .st-kicker{font-family:var(--font-interface);font-size:.68rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--rust-deep);}
.station-card h3{margin:6px 0 6px;font-size:1.15rem;}
.station-card p{margin:0 0 12px;color:#5a6a5d;font-size:.9rem;}
.station-card .st-open{display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:#3a2c0e;font-family:var(--font-interface);font-weight:800;border-radius:22px;padding:9px 16px;font-size:.86rem;margin-top:auto;align-self:flex-start;}
@media(max-width:640px){.station-grid{grid-template-columns:1fr;}}

/* ---------- Photo gallery (Screen 5A) ---------- */
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px 0 6px;}
.photo-tile{position:relative;border:none;padding:0;border-radius:11px;overflow:hidden;aspect-ratio:1/1;background:#4A4032;box-shadow:var(--shadow-sm);}
.photo-tile .tile-img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92;transition:opacity .12s;}
.photo-tile:hover .tile-img{opacity:1;}
.photo-tile .tile-year{position:absolute;bottom:6px;left:7px;background:rgba(15,20,15,.6);color:#f0e6c8;font-family:'Courier New',monospace;font-size:.66rem;padding:2px 6px;border-radius:4px;}
.photo-tile .tile-seen{position:absolute;top:6px;right:7px;background:var(--moss);color:#fff;font-size:.62rem;font-weight:800;padding:2px 6px;border-radius:10px;display:none;}
.photo-tile.seen .tile-seen{display:block;}
@media(max-width:560px){.gallery-grid{grid-template-columns:repeat(2,1fr);}}

/* ---------- Lightbox modal ---------- */
.drawer-overlay{position:fixed;inset:0;background:rgba(20,20,15,.5);z-index:110;}
.drawer{position:fixed;top:0;bottom:0;width:min(85vw,380px);background:var(--birch-card);box-shadow:var(--shadow-md);z-index:111;display:flex;flex-direction:column;transition:transform .22s ease;}
.drawer.left{left:0;transform:translateX(-100%);border-radius:0 18px 18px 0;}
.drawer.right{right:0;transform:translateX(100%);border-radius:18px 0 0 18px;}
.drawer.open{transform:translateX(0);}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;background:var(--leaf-deep);color:#fff;border-radius:inherit;border-bottom-left-radius:0;border-bottom-right-radius:0;}
.drawer.left .drawer-head{border-radius:0 18px 0 0;}
.drawer.right .drawer-head{border-radius:18px 0 0 0;}
.drawer-head h2{color:#fff;font-size:1.15rem;margin:0;}
.drawer-close{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:50%;width:34px;height:34px;font-size:1.1rem;flex:none;}
.drawer-body{padding:16px 18px 24px;overflow-y:auto;flex:1;}
.drawer-body dt{font-family:var(--font-title);font-weight:600;color:var(--rust-deep);font-size:1rem;margin:14px 0 3px;}
.drawer-body dt:first-child{margin-top:0;}
.drawer-body dd{margin:0 0 4px;font-size:.9rem;color:var(--charcoal);}
.journal-empty{color:#8a8270;font-size:.92rem;font-style:italic;}
.journal-entry{border-left:3px solid var(--moss);padding:2px 0 2px 12px;margin:0 0 16px;}
.journal-entry .je-screen{font-family:var(--font-interface);font-weight:800;font-size:.66rem;letter-spacing:.8px;text-transform:uppercase;color:var(--rust-deep);}
.journal-entry .je-q{font-weight:800;color:var(--charcoal);font-size:.9rem;margin:3px 0 5px;}
.journal-entry .je-a{background:var(--sky);border-radius:8px;padding:8px 10px;font-size:.88rem;color:#3d4a3f;}
.journal-entry .je-a.blank{color:#a39c86;font-style:italic;background:transparent;padding:0;}
.journal-entry.decision .je-a{background:#FDF0E4;color:var(--rust-deep);font-weight:700;}
.modal-box{background:var(--birch-card);border-radius:18px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-md);}
.modal-box .mb-photo-wrap{position:relative;background:#4A4032;}
.modal-box .mb-photo{width:100%;display:block;max-height:300px;object-fit:cover;}
.modal-box .mb-body{padding:18px 20px 20px;}
.modal-box .mb-close{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:34px;height:34px;font-size:1.1rem;}
.modal-box .mb-year{font-family:'Courier New',monospace;color:var(--rust-deep);font-weight:700;font-size:.85rem;margin-bottom:6px;}
.modal-box .mb-note{background:var(--sky);border-radius:9px;padding:10px 12px;font-size:.9rem;color:#3d4a3f;}
.gallery-expand{background:var(--birch-card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);margin-top:16px;animation:fade .2s ease;}
.gallery-expand .ge-photo-wrap{position:relative;background:#4A4032;}
.gallery-expand .ge-photo{width:100%;display:block;max-height:390px;object-fit:cover;}
.gallery-expand .ge-close{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:1.2rem;}
.gallery-expand .ge-body{padding:18px 20px 20px;}
.gallery-expand .ge-meta{font-family:'Courier New',monospace;color:var(--rust-deep);font-weight:700;font-size:.9rem;margin-bottom:8px;}
.gallery-expand .ge-note{background:var(--sky);border-radius:10px;padding:12px 14px;font-size:.95rem;color:#3d4a3f;}
.map-wrap2{position:relative;width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--sky);box-shadow:var(--shadow-sm);}
.map-wrap2 img{width:100%;height:100%;object-fit:cover;display:block;}
.map-wrap2 img.img-placeholder{position:absolute;inset:0;width:100%;height:100%;}
.map-point{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2;}
.map-marker{width:42px;height:42px;min-width:42px;min-height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;font-family:var(--font-interface);font-weight:800;font-size:1rem;color:#fff;cursor:pointer;padding:0;}
.map-marker:focus-visible{outline:3px solid var(--rust-deep);outline-offset:3px;}
.map-marker[aria-pressed="true"]{box-shadow:0 0 0 4px rgba(255,255,255,.85),0 2px 10px rgba(0,0,0,.4);transform:scale(1.14);}
.marker-school{background:var(--leaf-deep);}
.marker-town{background:var(--leaf);}
.marker-forest{background:#5b7a4a;}
.marker-sighting{background:var(--rust-deep);}
.marker-den{background:var(--rust);}
.marker-camera{background:#3d4a56;}
.map-point-label{background:rgba(255,255,255,.95);color:var(--charcoal);font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:8px;white-space:nowrap;box-shadow:var(--shadow-sm);max-width:120px;overflow:hidden;text-overflow:ellipsis;}
.map-legend{display:flex;flex-wrap:wrap;gap:10px 18px;margin:14px 0 4px;font-size:.86rem;}
.map-legend span{display:inline-flex;align-items:center;gap:7px;font-weight:700;}
.map-legend i{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.map-info-panel{background:var(--birch-card);border:1px solid #e3ddc9;border-left:4px solid var(--rust);border-radius:12px;padding:14px 16px;margin-top:8px;min-height:56px;}
.map-info-panel .mi-empty{color:#8a8270;font-style:italic;font-size:.9rem;margin:0;}
.map-info-panel .mi-label{font-family:var(--font-interface);font-weight:800;color:var(--leaf-deep);margin-bottom:4px;}
@media(max-width:480px){.map-point-label{font-size:.6rem;max-width:90px;}.map-marker{width:36px;height:36px;min-width:36px;min-height:36px;font-size:.88rem;}}


/* ---------- Decision Point 2 interactives ---------- */
.timeline-shell{background:var(--birch-card);border-radius:16px;padding:18px 20px;margin:0 0 18px;box-shadow:var(--shadow-sm);}
.timeline-top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:12px;}
.timeline-year-label{font-family:var(--font-title);font-size:1.45rem;color:var(--leaf-deep);margin:0;}
.timeline-progress{font-family:var(--font-interface);font-size:.78rem;font-weight:800;color:#6b796e;background:var(--sky);padding:5px 10px;border-radius:999px;}
.timeline-image-wrap{position:relative;width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--sky);box-shadow:var(--shadow-sm);}
.timeline-image-wrap img,.timeline-image-wrap .img-placeholder{width:100%;height:100%;object-fit:cover;display:block;margin:0;}
.timeline-controls{margin-top:15px;}
.timeline-range{width:100%;accent-color:var(--rust-deep);cursor:pointer;}
.timeline-years{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px;}
.timeline-year-btn{border:1px solid #d7ddd3;background:#fff;color:var(--charcoal);border-radius:12px;padding:9px 5px;font-family:var(--font-interface);font-weight:800;font-size:.78rem;min-height:42px;position:relative;}
.timeline-year-btn.active{background:var(--leaf-deep);border-color:var(--leaf-deep);color:#fff;}
.timeline-year-btn.viewed:not(.active)::after{content:"✓";position:absolute;top:-6px;right:-5px;width:18px;height:18px;border-radius:50%;background:var(--moss);color:#fff;font-size:.65rem;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}
.timeline-look{background:#FDF3DC;border:1px solid #EBD693;border-radius:12px;padding:13px 15px;margin:14px 0 0;}
.timeline-look strong{color:#7a5b08;}
.timeline-look ul{margin:7px 0 0 20px;padding:0;columns:2;column-gap:30px;}
.timeline-look li{margin:3px 0;font-size:.88rem;color:#5c4d1e;}

.identifier-wrap{position:relative;width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--sky);box-shadow:var(--shadow-sm);}
.identifier-wrap>img,.identifier-wrap>.img-placeholder{width:100%;height:100%;object-fit:cover;display:block;margin:0;}
.clue-hotspot{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;border:3px solid #fff;background:var(--rust-deep);color:#fff;font-family:var(--font-interface);font-weight:800;font-size:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.34);padding:0;z-index:3;}
.clue-hotspot:hover{transform:translate(-50%,-50%) scale(1.07);}
.clue-hotspot.selected-correct{background:var(--leaf-deep);}
.clue-hotspot.selected-distractor{background:#716b5f;}
.clue-hotspot.selected-correct::after{content:"✓";position:absolute;right:-6px;top:-8px;width:19px;height:19px;border-radius:50%;background:var(--amber);color:#3a2c0e;border:2px solid #fff;font-size:.65rem;display:flex;align-items:center;justify-content:center;}
.identifier-status{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:13px 0 8px;}
.identifier-count{font-family:var(--font-interface);font-weight:800;font-size:.8rem;color:var(--leaf-deep);background:var(--sky);border-radius:999px;padding:6px 11px;}
.identifier-feedback{background:var(--birch-card);border:1px solid #e3ddc9;border-left:4px solid var(--rust);border-radius:12px;padding:13px 15px;min-height:68px;}
.identifier-feedback.correct{border-left-color:var(--leaf);}
.identifier-feedback .if-title{font-family:var(--font-interface);font-weight:800;color:var(--leaf-deep);margin-bottom:3px;}
.food-record-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0 14px;}
.food-record{border:1px solid #e3ddc9;border-radius:14px;background:var(--birch-card);padding:0;overflow:hidden;text-align:left;box-shadow:var(--shadow-sm);}
.food-record:hover{border-color:var(--rust);}
.food-record.viewed{border:3px solid var(--moss);}
.food-record img,.food-record .img-placeholder{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;margin:0;border-radius:0;}
.food-record-copy{padding:12px 14px;}
.food-record-copy strong{display:block;color:var(--leaf-deep);margin-bottom:3px;}
.food-record-copy span{font-size:.82rem;color:#6b796e;}
.food-record-detail{background:var(--sky);border-radius:12px;padding:13px 15px;margin-top:8px;min-height:58px;}
.dp2-complete{background:var(--sky);border-radius:14px;padding:14px 16px;margin-top:14px;color:#3d4a3f;font-size:.9rem;}
@media(max-width:640px){
  .timeline-look ul{columns:1;}
  .timeline-years{gap:5px;}
  .timeline-year-btn{font-size:.68rem;padding:8px 2px;}
  .clue-hotspot{width:38px;height:38px;font-size:.78rem;}
  .food-record-grid{grid-template-columns:1fr;}
}


/* ---------- Final investigation sequence ---------- */
.dp2-share-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 18px;}
.dp2-share-card{background:var(--birch-card);border:1px solid #e3ddc9;border-radius:14px;padding:16px 17px;box-shadow:var(--shadow-sm);}
.dp2-share-card.yours{border-top:6px solid var(--leaf);}
.dp2-share-card.shared{border-top:6px solid var(--rust);}
.dp2-share-card .share-kicker{font-family:var(--font-interface);font-size:.68rem;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--rust-deep);margin-bottom:4px;}
.dp2-share-card h3{font-size:1.12rem;margin:0 0 8px;}
.dp2-share-card .share-source{display:inline-block;background:var(--sky);color:var(--leaf-deep);border-radius:14px;padding:3px 9px;margin:0 0 9px;font-family:var(--font-interface);font-size:.7rem;font-weight:800;}
.dp2-share-card .share-text{margin:0;white-space:pre-wrap;color:#3d4a3f;font-size:.94rem;}

.loop-builder{background:var(--birch-card);border-radius:16px;padding:18px 20px;margin:0 0 18px;box-shadow:var(--shadow-sm);}
.loop-order{display:grid;gap:10px;margin:12px 0 16px;}
.loop-step{display:grid;grid-template-columns:38px 1fr auto;gap:11px;align-items:center;background:var(--sky);border:1px solid #d7e4dc;border-radius:13px;padding:10px 11px;}
.loop-step-num{width:34px;height:34px;border-radius:50%;background:var(--leaf-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-interface);font-weight:800;}
.loop-step-text{font-size:.91rem;color:#35453a;font-weight:600;}
.loop-move{display:flex;gap:5px;}
.loop-move button{border:1px solid #cfd8d1;background:#fff;color:var(--leaf-deep);width:34px;height:34px;border-radius:9px;font-weight:900;}
.loop-move button:disabled{opacity:.35;cursor:not-allowed;}
.model-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0;}
.model-choice-group{background:#FDF3DC;border:1px solid #EBD693;border-radius:12px;padding:13px 15px;}
.model-choice-group legend{font-family:var(--font-title);font-weight:700;color:#7a5b08;padding:0 5px;}
.model-radio{display:block;background:#fff;border:1px solid #e5d8ad;border-radius:10px;padding:9px 10px;margin:7px 0;font-size:.86rem;cursor:pointer;}
.model-radio input{margin-right:8px;}
.model-feedback{border-left:4px solid var(--rust);background:#FDF0E4;border-radius:10px;padding:12px 14px;margin:12px 0 0;color:#6e421e;}
.model-feedback.correct{border-left-color:var(--leaf);background:var(--sky);color:#30483a;}
.completed-loop{background:linear-gradient(135deg,#eef7f1,#fff9ea);border:1px solid #cfe1d5;border-radius:15px;padding:16px;margin:14px 0;}
.completed-loop-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center;}
.completed-loop-node{background:#fff;border:2px solid var(--leaf);border-radius:12px;padding:9px 11px;font-size:.8rem;font-weight:700;color:var(--leaf-deep);max-width:150px;text-align:center;}
.completed-loop-arrow{font-weight:900;color:var(--rust-deep);font-size:1.15rem;}
.loop-back{text-align:center;margin-top:9px;font-size:.8rem;color:#6b796e;font-weight:700;}

/* Constructible feedback-loop modeler */
.loop-build-intro{font-size:.96rem;color:#4c594f;margin:0 0 16px;}
.loop-build-layout{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:18px;align-items:start;margin:12px 0 18px;}
.loop-evidence-bank{background:#f8faf9;border:1px solid #dce3de;border-radius:15px;padding:16px;}
.loop-evidence-bank h3{margin-bottom:10px;color:var(--rust-deep);}
.loop-bank-list{display:grid;gap:9px;}
.loop-bank-chip{width:100%;border:1px solid #cfd8d1;background:#fff;color:#303a33;border-radius:999px;padding:10px 13px;text-align:left;font-family:var(--font-interface);font-size:.82rem;font-weight:700;box-shadow:var(--shadow-sm);cursor:grab;}
.loop-bank-chip:active{cursor:grabbing;}
.loop-bank-chip .chip-tag{display:block;color:var(--rust-deep);font-size:.62rem;letter-spacing:.7px;text-transform:uppercase;margin-bottom:2px;}
.loop-bank-chip.is-used{display:none;}
.loop-bank-tip{font-size:.76rem;color:#859087;margin:12px 0 0;}
.loop-reset-btn{margin-top:12px;border:1px solid #cfd8d1;background:transparent;color:#5e6a61;border-radius:999px;padding:9px 14px;font-weight:800;}
.loop-model-panel{background:#f8faf9;border:1px solid #dce3de;border-radius:15px;padding:14px;min-width:0;}
.loop-cycle-stage{position:relative;width:100%;max-width:610px;aspect-ratio:1/1;margin:0 auto;}
.loop-cycle-svg{position:absolute;inset:7%;width:86%;height:86%;overflow:visible;pointer-events:none;}
.loop-cycle-svg>path{fill:none;stroke:#c7cfd4;stroke-width:2.2;}
.loop-drop-zone{position:absolute;width:38%;min-height:21%;transform:translate(-50%,-50%);border:2px dashed #c8d0d6;background:rgba(255,255,255,.96);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow-sm);transition:border-color .12s,background .12s,transform .12s;}
.loop-drop-zone.drag-over{border-color:var(--rust);background:#fff7ed;transform:translate(-50%,-50%) scale(1.02);}
.loop-drop-zone[data-slot="0"]{left:50%;top:16%;}
.loop-drop-zone[data-slot="1"]{left:82%;top:50%;}
.loop-drop-zone[data-slot="2"]{left:50%;top:84%;}
.loop-drop-zone[data-slot="3"]{left:18%;top:50%;}
.loop-slot-label{font-family:var(--font-interface);font-size:.66rem;letter-spacing:.7px;text-transform:uppercase;color:#909aa4;font-weight:800;margin-bottom:5px;}
.loop-slot-empty{color:#9ca5ae;font-size:.86rem;}
.loop-placed-chip{position:relative;border:none;background:transparent;color:#334239;font-family:var(--font-interface);font-size:.78rem;font-weight:750;line-height:1.35;text-align:left;padding:0 25px 0 0;cursor:grab;}
.loop-remove-chip{position:absolute;top:-5px;right:-4px;width:24px;height:24px;border:none;border-radius:50%;background:#edf1ee;color:#69756c;font-size:.9rem;font-weight:900;line-height:1;}
.loop-sequence-note{text-align:center;color:#8a96a0;font-size:.78rem;margin:2px 0 8px;}
.loop-builder .model-justification{margin-top:16px;}
.loop-builder .model-justification textarea{min-height:120px;}
.loop-completion-hint{font-size:.78rem;color:#7d887f;margin-top:7px;}
@media(max-width:760px){
  .loop-build-layout{grid-template-columns:1fr;}
  .loop-evidence-bank{order:2;}
  .loop-model-panel{order:1;}
}
@media(max-width:520px){
  .loop-cycle-stage{aspect-ratio:1/1.12;}
  .loop-drop-zone{width:42%;min-height:23%;padding:9px 10px;}
  .loop-drop-zone[data-slot="0"]{top:15%;}
  .loop-drop-zone[data-slot="1"]{left:79%;top:50%;}
  .loop-drop-zone[data-slot="2"]{top:85%;}
  .loop-drop-zone[data-slot="3"]{left:21%;top:50%;}
  .loop-placed-chip{font-size:.68rem;line-height:1.25;padding-right:20px;}
  .loop-slot-label{font-size:.58rem;}
  .loop-slot-empty{font-size:.72rem;}
}

.recommendation-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 16px;}
.rec-action{border:2px solid #d9dfda;background:#fff;border-radius:13px;padding:13px 14px;text-align:left;min-height:108px;display:flex;flex-direction:column;gap:5px;}
.rec-action[aria-pressed="true"]{border-color:var(--leaf);background:var(--sky);box-shadow:0 0 0 3px rgba(62,140,92,.12);}
.rec-action .rec-tag{font-size:.66rem;text-transform:uppercase;letter-spacing:.8px;font-weight:800;color:var(--rust-deep);}
.rec-action strong{color:var(--leaf-deep);font-size:.92rem;}
.evidence-builder{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0 16px;}
.evidence-box{border:1px solid #e3ddc9;border-radius:12px;padding:13px 14px;background:#fff;}
.evidence-box h3{font-size:1rem;margin-bottom:8px;}
.evidence-option{display:block;background:var(--sky);border-radius:9px;padding:9px 10px;margin:7px 0;font-size:.84rem;cursor:pointer;}
.evidence-option input{margin-right:7px;}
.rec-requirements{font-size:.8rem;color:#6b796e;margin:8px 0 12px;}
.recommendation-preview{background:#f7f5ee;border:1px solid #d9d4c4;border-radius:16px;padding:14px;margin:18px 0 0;box-shadow:var(--shadow-sm);}
.rec-build-status{margin:10px 0 0;padding:11px 13px;border-radius:10px;font-size:.86rem;line-height:1.45;}
.rec-build-status.info{background:var(--sky);color:#3d4a3f;}
.rec-build-status.error{background:#FDF0E4;border:1px solid #E9B38D;color:#7A3B15;}
.rec-build-status.success{background:#EAF4EF;border:1px solid #BFD9C8;color:var(--leaf-deep);font-weight:700;}

.recommendation-preview>h3{margin:0 0 10px;}
.video-meeting{background:#25332d;border-radius:16px;padding:12px;margin:0 0 18px;box-shadow:var(--shadow-md);}
.video-meeting-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#dce8e0;font-family:var(--font-interface);font-size:.72rem;font-weight:800;padding:2px 4px 10px;}
.video-live{display:inline-flex;align-items:center;gap:7px;}
.video-live::before{content:"";width:9px;height:9px;border-radius:50%;background:#ef5d4f;box-shadow:0 0 0 3px rgba(239,93,79,.22);}
.video-tile{background:linear-gradient(145deg,#eef4ef,#dbe8df);border-radius:12px;padding:18px;display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:center;min-height:150px;}
.video-avatar{width:72px;height:72px;border-radius:50%;background:var(--leaf-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-title);font-size:1.35rem;font-weight:700;border:4px solid rgba(255,255,255,.85);box-shadow:var(--shadow-sm);}
.video-speaker{font-family:var(--font-interface);font-weight:800;color:var(--rust-deep);font-size:.8rem;margin-bottom:5px;}
.video-quote{margin:0;color:#304438;font-size:.98rem;line-height:1.55;}
.video-caption{font-size:.72rem;color:#738178;margin-top:7px;}
.recommendation-document{background:#fff;border:1px solid #d7ddd3;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(38,49,41,.12);}
.rec-doc-header{background:linear-gradient(135deg,var(--leaf-deep),var(--leaf));color:#fff;padding:22px 24px 20px;border-bottom:5px solid var(--amber);}
.rec-doc-kicker{font-family:var(--font-interface);font-weight:800;font-size:.68rem;letter-spacing:1.1px;text-transform:uppercase;color:var(--amber);margin-bottom:5px;}
.rec-doc-header h3{color:#fff;font-size:1.5rem;margin:0 0 5px;}
.rec-doc-header p{margin:0;color:#e5eee8;font-size:.86rem;}
.rec-doc-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-bottom:1px solid #e4e8e4;background:#f7faf8;}
.rec-doc-meta div{padding:12px 15px;border-right:1px solid #e4e8e4;font-size:.8rem;color:#415046;}
.rec-doc-meta div:last-child{border-right:none;}
.rec-doc-meta span{display:block;font-family:var(--font-interface);font-size:.62rem;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#7b897f;margin-bottom:3px;}
.rec-doc-body{padding:20px 22px 22px;}
.rec-doc-section{margin:0 0 18px;}
.rec-doc-section:last-child{margin-bottom:0;}
.rec-doc-section h4{font-size:1rem;color:var(--leaf-deep);margin:0 0 8px;padding-bottom:5px;border-bottom:2px solid #e7eee9;}
.rec-action-list{margin:0;padding-left:22px;}
.rec-action-list li{margin:7px 0;padding-left:3px;}
.rec-evidence-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.rec-evidence-card{background:var(--sky);border-radius:10px;padding:12px 13px;border-left:4px solid var(--moss);}
.rec-evidence-card strong{display:block;color:var(--leaf-deep);font-family:var(--font-interface);font-size:.76rem;margin-bottom:4px;}
.rec-evidence-card p,.rec-doc-reasoning{margin:0;color:#3d4a3f;font-size:.88rem;line-height:1.55;white-space:pre-wrap;}
.rec-doc-closing{background:#fff7e6;border:1px solid #ecd79d;border-radius:10px;padding:11px 13px;color:#66531b;font-size:.82rem;}
.committee-reply{background:#fff;border:1px solid #d9dfda;border-left:5px solid var(--leaf);border-radius:12px;padding:15px 17px;margin:0 0 16px;box-shadow:var(--shadow-sm);}
.committee-reply .reply-label{font-family:var(--font-interface);font-size:.68rem;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--rust-deep);margin-bottom:6px;}
.committee-reply p{margin:0;line-height:1.55;}
@media(max-width:640px){
  .video-tile{grid-template-columns:56px 1fr;padding:14px;gap:12px;}
  .video-avatar{width:56px;height:56px;font-size:1.05rem;}
  .rec-doc-meta{grid-template-columns:1fr;}
  .rec-doc-meta div{border-right:none;border-bottom:1px solid #e4e8e4;}
  .rec-doc-meta div:last-child{border-bottom:none;}

}

.reflection-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
.reflection-card{background:var(--birch-card);border-radius:14px;padding:16px;box-shadow:var(--shadow-sm);}
.quiz-shell{margin-top:18px;}
.quiz-choice-card{background:#fff;border:1px solid #dfe2e6;border-radius:16px;padding:18px 20px;box-shadow:var(--shadow-sm);}
.quiz-segmented{display:inline-grid;grid-template-columns:1fr 1fr;border:2px solid #cbd3df;border-radius:999px;overflow:hidden;max-width:520px;width:100%;}
.quiz-toggle{border:none;background:#fff;color:#24324a;padding:11px 18px;font-family:var(--font-interface);font-weight:800;font-size:.9rem;min-height:48px;}
.quiz-toggle.active{background:#1fa99e;color:#fff;}
.quiz-panel{margin-top:16px;}
.quiz-question{background:#fff;border:1px solid #dfe2e6;border-radius:16px;padding:18px 20px;margin:0 0 16px;box-shadow:var(--shadow-sm);}
.quiz-qnum{font-family:var(--font-interface);font-size:.72rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#8997ad;margin-bottom:8px;}
.quiz-prompt{font-family:var(--font-title);font-size:1.08rem;color:#302974;line-height:1.4;margin:0 0 12px;}
.quiz-option{display:flex;align-items:flex-start;gap:10px;background:#f8f9fb;border:2px solid #dfe4eb;border-radius:11px;padding:10px 12px;margin:8px 0;cursor:pointer;font-size:.9rem;}
.quiz-option:has(input:checked){border-color:#1fa99e;background:#eefaf8;}
.quiz-option input{margin-top:4px;flex:none;}
.quiz-option.disabled{cursor:default;}
.quiz-feedback{border-radius:11px;padding:11px 13px;margin-top:11px;font-size:.85rem;}
.quiz-feedback.correct{background:#edf8f1;border-left:4px solid var(--leaf);color:#31513e;}
.quiz-feedback.incorrect{background:#fff1e7;border-left:4px solid var(--rust);color:#6e421e;}
.quiz-score{background:#edf8f1;border:2px solid var(--leaf);border-radius:14px;padding:15px 17px;margin:14px 0;font-weight:700;color:var(--leaf-deep);}
.quiz-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px;}
.export-panel{background:#fff;border:1px solid #dfe2e6;border-radius:16px;padding:18px 20px;margin-top:18px;box-shadow:var(--shadow-sm);}
.export-btn{background:#ffb632;color:#3a2c0e;border:none;border-radius:12px;padding:13px 18px;font-family:var(--font-interface);font-weight:900;font-size:.92rem;}
.je-a{white-space:pre-wrap;}
@media(max-width:700px){
  .dp2-share-grid,.model-choice-grid,.recommendation-grid,.evidence-builder,.reflection-grid{grid-template-columns:1fr;}
  .loop-step{grid-template-columns:34px 1fr;}
  .loop-move{grid-column:2;justify-content:flex-end;}

/* ===================== Screen router ===================== */
const SCREENS={};
function registerScreen(n,def){SCREENS[n]=def;}
const TRACKER_STAGES=[
  {label:"Observe and Report",value:"Document the sighting"},
  {label:"First Evidence",value:"Compare the Ridge Den pattern"},
  {label:"Environmental Evidence",value:"Investigate possible causes"},
  {label:"Model the Pattern",value:"Build the feedback loop"},
  {label:"Recommend and Reflect",value:"Use evidence for action"}
];
function stageIndexForScreen(screen){
  const s=String(screen);
  if(["2","3","4","5","6"].includes(s))return 0;
  if(["7","8A","8B","9"].includes(s))return 1;
  if(["10","11","12A","12B","13"].includes(s))return 2;
  if(["14","15"].includes(s))return 3;
  if(["16","17"].includes(s))return 4;
  return -1;
}
function setContinue(){const b=$("#continueBtn");if(b){b.disabled=false;b.removeAttribute("aria-disabled");}}
function updateHeader(){
  const screen=state.navigation.currentScreen;
  const launch=String(screen)==="1";
  document.body.classList.toggle("launch-mode",launch);
  const def=SCREENS[screen];
  $("#headerTitle").textContent="The Fox at Recess";
  const nav=$("#navbar");
  const hideNav=launch||!!(def&&def.hideNav);
  nav.classList.toggle("hidden",hideNav);
  updateTracker(screen);
}
function updateTracker(screen){
  const tracker=$("#tracker");
  const launch=String(screen)==="1";
  tracker.classList.toggle("hidden",launch);
  if(launch){tracker.innerHTML="";return;}
  const current=stageIndexForScreen(screen);
  state.navigation.currentStage=TRACKER_STAGES[Math.max(0,current)].label;
  tracker.innerHTML=`<div class="tracker-inner">${TRACKER_STAGES.map((stage,i)=>{
    const status=i<current?"is-complete":i===current?"is-current":"is-future";
    const stateText=i<current?"Completed":i===current?"Current":"Upcoming";
    let value=stage.value;
    if(i===1&&state.navigation.firstPath)value=state.navigation.firstPath==="gallery"?"Sightings evidence selected":"Field measurements selected";
    if(i===2&&state.navigation.secondPath)value=state.navigation.secondPath==="habitat"?"Habitat evidence selected":"Food-access evidence selected";
    return `<div class="tracker-step ${status}" ${i===current?'aria-current="step"':''}><span class="ts-num">${i<current?"✓":i+1}</span><span class="ts-copy"><span class="ts-label">${esc(stage.label)} · ${stateText}</span><br><span class="ts-value">${esc(value)}</span></span></div>`;
  }).join("")}</div>`;
}
function focusCurrentHeading(){
  const heading=$("#stage .screen h1, #stage .screen h2");
  if(heading){heading.setAttribute("tabindex","-1");heading.focus({preventScroll:true});}
}
function renderScreen(){
  const screen=state.navigation.currentScreen;
  const def=SCREENS[screen];
  const stage=$("#stage");
  if(!def){stage.innerHTML="<p>Screen not found.</p>";return;}
  stage.innerHTML=def.render();
  updateHeader();
  setContinue();
  if(def.init)def.init(stage);
}
function renderCurrent(){renderScreen();}
function normalizeRequestedScreen(screen){
  let n=screen;
  if(n==="8A"&&state.navigation.firstPath!=="gallery")n=7;
  if(n==="8B"&&state.navigation.firstPath!=="dashboard")n=7;
  if(([9,10,11,"12A","12B",13,14,15,16,17].some(x=>String(x)===String(n)))&&!state.navigation.firstPath)n=7;
  if(n==="12A"&&state.navigation.secondPath!=="habitat")n=11;
  if(n==="12B"&&state.navigation.secondPath!=="food")n=11;
  if(([13,14,15,16,17].some(x=>String(x)===String(n)))&&!state.navigation.secondPath)n=11;
  return n;
}
function goToScreen(screen){
  const n=normalizeRequestedScreen(screen);
  closeActiveLayer(false);
  if(window.speechSynthesis)window.speechSynthesis.cancel();
  state.navigation.currentScreen=n;
  state.started=String(n)!=="1";
  if(state.started&&!state.meta.startedAt)state.meta.startedAt=nowISO();
  if(String(n)==="17")state.completed=true;
  recordScreenEncounter(n);
  saveState();
  renderScreen();
  window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
  if(String(n)!=="1")requestAnimationFrame(focusCurrentHeading);
  announce(`Opened ${SCREENS[n]&&SCREENS[n].title?SCREENS[n].title:"the next lesson page"}.`);
}
function validationResult(valid,selector,message){return {valid,selector,message};}
function validateCurrentScreen(){
  const n=String(state.navigation.currentScreen);
  const txt=(v,min=1)=>String(v||"").trim().length>=min;
  if(n==="3")return validationResult(txt(state.entry.homeNote),"#q_home","Add Gracie's evidence note before continuing.");
  if(n==="4")return validationResult(txt(state.entry.emailBody),"#email_body","Write the observation-based email before continuing.");
  if(n==="6")return validationResult(txt(state.entry.mapObservation),"#map_note","Add your Pinecrest map note before continuing.");
  if(n==="7")return validationResult(!!state.navigation.firstPath,".station-grid","Choose one evidence path before continuing.");
  if(n==="8A"){
    if(state.firstInvestigation.gallery.photosViewed.length<GALLERY.length)return validationResult(false,"#galleryGrid","Open all eight trail-camera records before continuing.");
    return validationResult(txt(state.firstInvestigation.gallery.patternNote),"#gal_pattern","Add the Sightings Team note before continuing.");
  }
  if(n==="8B"){
    if(state.firstInvestigation.dashboard.variablesViewed.length<3)return validationResult(false,"#varChips","Examine all three field measurements before continuing.");
    return validationResult(txt(state.firstInvestigation.dashboard.claim),"#dash_claim","Add the Numbers Team note before continuing.");
  }
  if(n==="9")return validationResult(txt(state.firstInvestigation.convergence.combinedClaim),"#convergence_claim","Combine one finding from each team before continuing.");
  if(n==="11")return validationResult(!!state.navigation.secondPath,".station-grid","Choose one environmental evidence file before continuing.");
  if(n==="12A"){
    if(state.secondInvestigation.habitat.yearsViewed.length<5)return validationResult(false,".timeline-shell","View all five habitat years before continuing.");
    return validationResult(txt(state.secondInvestigation.habitat.teamNote),"#habitat_team_note","Add the Habitat Team note before continuing.");
  }
  if(n==="12B"){
    if(state.secondInvestigation.food.foundCorrect.length<FOOD_CORRECT_IDS.length)return validationResult(false,"#foodScene","Find all four food-access clues before continuing.");
    if(state.secondInvestigation.food.viewedRecords.length<FOOD_RECORDS.length)return validationResult(false,"#foodFollowup","Open both follow-up camera records before continuing.");
    return validationResult(txt(state.secondInvestigation.food.teamNote),"#food_team_note","Add the Food Access Team note before continuing.");
  }
  if(n==="13")return validationResult(txt(state.secondInvestigation.convergence.combinedExplanation),"#dp2_convergence","Connect the habitat and food-access evidence before continuing.");
  if(n==="15"){
    if(!Array.isArray(state.feedbackModel.slots)||!state.feedbackModel.slots.every(Boolean))return validationResult(false,"#loopCycle","Complete all four steps of the feedback-loop model before continuing.");
    return validationResult(txt(state.feedbackModel.explanation,15),"#model_explanation","Add an evidence-based model justification before continuing.");
  }
  if(n==="16")return validationResult(!!state.recommendation.finalText,"#buildRecommendation","Create the committee recommendation brief before continuing.");
  return validationResult(true,"","");
}
function clearValidation(){
  $$(".validation-message").forEach(el=>el.remove());
  $$(".needs-attention").forEach(el=>el.classList.remove("needs-attention"));
}
function showValidation(result){
  clearValidation();
  const target=$(result.selector)||$("#stage");
  const message=document.createElement("div");
  message.className="validation-message";
  message.setAttribute("role","alert");
  message.textContent=result.message;
  if(target.matches("textarea,input,button"))target.insertAdjacentElement("afterend",message);else target.appendChild(message);
  target.classList.add("needs-attention");
  target.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"center"});
  if(typeof target.focus==="function"){
    if(!target.hasAttribute("tabindex")&&!target.matches("textarea,input,button,select,a"))target.setAttribute("tabindex","-1");
    target.focus({preventScroll:true});
  }
  setTimeout(()=>target.classList.remove("needs-attention"),1300);
  announce(result.message);
}
function attemptContinue(){
  const result=validateCurrentScreen();
  if(!result.valid){showValidation(result);return false;}
  clearValidation();
  nextScreen();return true;
}
function nextScreen(){
  const n=String(state.navigation.currentScreen);
  if(n==="1"){goToScreen(2);return;}
  if(n==="7"){goToScreen(state.navigation.firstPath==="gallery"?"8A":"8B");return;}
  if(n==="8A"||n==="8B"){goToScreen(9);return;}
  if(n==="11"){goToScreen(state.navigation.secondPath==="habitat"?"12A":"12B");return;}
  if(n==="12A"||n==="12B"){goToScreen(13);return;}
  const order=["2","3","4","5","6","7","9","10","11","13","14","15","16","17"];
  const i=order.indexOf(n);if(i>=0&&i<order.length-1)goToScreen(Number.isNaN(Number(order[i+1]))?order[i+1]:Number(order[i+1]));
}
function prevScreen(){
  const n=String(state.navigation.currentScreen);
  if(n==="17"){goToScreen(16);return;}
  if(n==="16"){goToScreen(15);return;}
  if(n==="15"){goToScreen(14);return;}
  if(n==="14"){goToScreen(13);return;}
  if(n==="13"){goToScreen(state.navigation.secondPath==="habitat"?"12A":"12B");return;}
  if(n==="12A"||n==="12B"){goToScreen(11);return;}
  if(n==="11"){goToScreen(10);return;}
  if(n==="10"){goToScreen(9);return;}
  if(n==="9"){goToScreen(state.navigation.firstPath==="gallery"?"8A":"8B");return;}
  if(n==="8A"||n==="8B"){goToScreen(7);return;}
  const order=["1","2","3","4","5","6","7"];
  const i=order.indexOf(n);if(i>0)goToScreen(Number(order[i-1]));
}
$("#continueBtn").addEventListener("click",attemptContinue);

/* ---------- Drawers and styled modals ---------- */
let activeLayer=null;
function focusableElements(container){return $$('button:not([disabled]),[href],input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])',container).filter(el=>!el.hidden&&el.offsetParent!==null);}
function handleLayerKeydown(event){
  if(!activeLayer)return;
  if(event.key==="Escape"){event.preventDefault();closeActiveLayer(true);return;}
  if(event.key!=="Tab")return;
  const items=focusableElements(activeLayer.container);
  if(!items.length){event.preventDefault();activeLayer.container.focus();return;}
  const first=items[0],last=items[items.length-1];
  if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
}
function activateLayer(container,trigger,initialSelector,onClose){
  activeLayer={container,trigger:trigger||document.activeElement,onClose:onClose||null};
  document.body.classList.add("no-scroll");
  document.addEventListener("keydown",handleLayerKeydown);
  requestAnimationFrame(()=>{const first=initialSelector?$(initialSelector,container):null;(first||focusableElements(container)[0]||container).focus();});
}
function closeActiveLayer(restoreFocus=true){
  if(!activeLayer){$("#modalRoot").innerHTML="";document.body.classList.remove("no-scroll");return;}
  const previous=activeLayer;activeLayer=null;
  document.removeEventListener("keydown",handleLayerKeydown);
  document.body.classList.remove("no-scroll");
  $("#modalRoot").innerHTML="";
  if(previous.onClose)previous.onClose();
  if(restoreFocus&&previous.trigger&&typeof previous.trigger.focus==="function")previous.trigger.focus();
}
function openDrawer(side,titleText,bodyHtml,trigger){
  closeActiveLayer(false);
  const root=$("#modalRoot");
  root.innerHTML=`<div class="drawer-overlay" id="drOverlay"></div><aside class="drawer ${side}" id="drPanel" role="dialog" aria-modal="true" aria-labelledby="drTitle" tabindex="-1"><div class="drawer-head"><h2 id="drTitle">${esc(titleText)}</h2><button class="drawer-close" id="drClose" type="button" aria-label="Close ${esc(titleText)}">&times;</button></div><div class="drawer-body">${bodyHtml}</div></aside>`;
  const panel=$("#drPanel",root);
  $("#drOverlay",root).addEventListener("click",()=>closeActiveLayer(true));
  $("#drClose",root).addEventListener("click",()=>closeActiveLayer(true));
  activateLayer(panel,trigger||document.activeElement,"#drClose");
  requestAnimationFrame(()=>panel.classList.add("open"));
}
function openStyledModal({title,body,trigger,initialSelector,onMount}){
  closeActiveLayer(false);
  const root=$("#modalRoot");
  root.innerHTML=`<div class="modal-shell" id="activeModalOverlay"><section class="modal-dialog" id="activeModal" role="dialog" aria-modal="true" aria-labelledby="activeModalTitle" tabindex="-1"><div class="modal-head"><h2 id="activeModalTitle">${esc(title)}</h2><button type="button" class="modal-close" id="activeModalClose" aria-label="Close">&times;</button></div><div class="modal-body">${body}</div></section></div>`;
  const overlay=$("#activeModalOverlay",root),dialog=$("#activeModal",root);
  overlay.addEventListener("click",event=>{if(event.target===overlay)closeActiveLayer(true);});
  $("#activeModalClose",root).addEventListener("click",()=>closeActiveLayer(true));
  activateLayer(dialog,trigger||document.activeElement,initialSelector||"#activeModalClose");
  if(onMount)onMount(root);
}
function openRestartModal(){
  const trigger=$("#restartBtn");
  openStyledModal({title:"Restart this lesson?",trigger,initialSelector:"#keepProgress",body:`<p>This will erase your current decisions, models, written responses, journal entries, and optional quiz progress from this device.</p><div class="modal-actions"><button type="button" class="btn btn-outline" id="keepProgress">Keep My Progress</button><button type="button" class="btn-danger" id="confirmRestart">Restart Lesson</button></div>`,onMount(root){
    $("#keepProgress",root).addEventListener("click",()=>closeActiveLayer(true));

/* ===================== Glossary ===================== */
const GLOSSARY=[
  ["Litter size","The number of kits (baby foxes) born to a vixen in one season."],
  ["Body condition","A simple 1–5 rating of how healthy and well-fed an animal looks."],
  ["Trail camera","A weatherproof camera set up in the field that takes a photo automatically when it detects motion."],
  ["Field data","Measurements collected by scientists directly in a natural habitat, not in a lab."],
  ["Environmental condition","A feature of an organism's surroundings, such as food, temperature, water, shelter, or human activity."],
  ["Inherited trait","A characteristic passed from parents to offspring through genes."],
  ["Feedback loop","A pattern in which one change leads to effects that circle back and strengthen or continue the pattern."]
];
function openGlossary(){openDrawer("left","Glossary",`<dl>${GLOSSARY.map(([term,definition])=>`<dt>${esc(term)}</dt><dd>${esc(definition)}</dd>`).join("")}</dl>`,$("#glossaryBtn"));}

/* ===================== Investigation Journal ===================== */
function screenEncountered(screen){return !!(state.progress&&state.progress.encounteredScreens||[]).some(x=>String(x)===String(screen));}
function nonBlank(value){return String(value==null?"":value).trim();}
function journalRecord(records,screen,stage,label,value,type="response"){
  const clean=nonBlank(value);if(!screenEncountered(screen)||!clean)return;
  records.push({screen:String(screen),stage,label,value:clean,type});
}
function getJournalRecords(){
  const records=[];
  journalRecord(records,3,"Observe and Report","Evidence recorded from the playground sighting and Ridge Trail experiences",state.entry.homeNote);
  const email=[nonBlank(state.entry.emailSubject)?`Subject: ${nonBlank(state.entry.emailSubject)}`:"",nonBlank(state.entry.emailBody)].filter(Boolean).join("\n");
  journalRecord(records,4,"Observe and Report","Observation-based email to the Pinecrest Elementary Front Office",email);
  const orientation=(state.evidenceSelections.mapLocations.orientation||[]).map(id=>(MAP_POINTS.orientation.find(p=>p.id===id)||{}).label).filter(Boolean);
  journalRecord(records,6,"Observe and Report","Pinecrest map locations examined",orientation.join(", "),"evidence");
  journalRecord(records,6,"Observe and Report","Pinecrest map note",state.entry.mapObservation);
  journalRecord(records,7,"First Evidence","First evidence path selected",state.navigation.firstPath==="gallery"?"Study the Sightings: trail-camera evidence":state.navigation.firstPath==="dashboard"?"Study the Numbers: field measurements":"","decision");

  if(state.navigation.secondPath==="habitat"){
    const years=(state.secondInvestigation.habitat.yearsViewed||[]).slice().sort().join(", ");

  if(screenEncountered(17)&&quizOpened){
    if(state.quiz.choice==="skip")journalRecord(records,17,"Optional Quiz","Optional quiz status","Student chose not to take the optional quiz.","quiz");
    else{

      QUIZ_QUESTIONS.forEach((question,index)=>{
        if(!Object.prototype.hasOwnProperty.call(state.quiz.answers,question.id))return;
        const selected=Number(state.quiz.answers[question.id]);

        let value=`Final selected answer: ${answer?answer.text:"No response"}`;
        if(state.quiz.submitted){value+=`\nCorrect answer: ${question.options[question.answer].text}\nResult: ${selected===question.answer?"Correct":"Incorrect"}\nFeedback: ${selected===question.answer?answer.feedback:`${answer.feedback} Nudge: ${question.nudge}`}`;}
        if(Number(state.quiz.revisions&&state.quiz.revisions[question.id])>0)value+=`\nRevised: Yes (${state.quiz.revisions[question.id]} change${state.quiz.revisions[question.id]===1?"":"s"})`;
        journalRecord(records,17,"Optional Quiz",`Question ${index+1}: ${question.prompt}`,value,"quiz");
      });
    }
  }
  return records;
}

function normalizeFilename(value){return String(value||"").toLowerCase().replace(/[\s\u2013\u2014:]+/g," ").trim();}
function buildExportFilename(input){
  const title=state.lessonTitle||state.meta.lessonTitle;
  let base=String(input||"").trim()||"Student Journal";
  const normalizedBase=normalizeFilename(base),normalizedTitle=normalizeFilename(title);

  return base.replace(/[<>:"/\\|?*\x00-\x1F]/g,"-").replace(/\s+/g," ").replace(/[. ]+$/g,"").slice(0,180)||`Student Journal – ${title}`;
}
function exportedJournalDocument(){

function exportJournal(name){

function chartSVG(dens,varKey){
  const V=VARIABLES[varKey];
  const W=580,H=280,padL=46,padR=16,padT=22,padB=34;
  const x=i=>padL+(i/(YEARS.length-1))*(W-padL-padR);
  const y=v=>H-padB-((v-V.yMin)/(V.yMax-V.yMin))*(H-padT-padB);
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(V.label)} by year" style="width:100%;height:auto;font-family:var(--font-body),sans-serif;">`;
  const gridSteps=4;
  for(let s=0;s<=gridSteps;s++){
    const v=V.yMin+(V.yMax-V.yMin)*(s/gridSteps);
    svg+=`<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="#e8e1cc" stroke-width="1"/>`;
    svg+=`<text x="${padL-8}" y="${y(v)+4}" font-size="11" fill="#7a715c" text-anchor="end">${Math.round(v*10)/10}</text>`;
  }
  YEARS.forEach((yr,i)=>{
    svg+=`<line x1="${x(i)}" y1="${padT}" x2="${x(i)}" y2="${H-padB}" stroke="#f0ebd9" stroke-width="1"/>`;
    svg+=`<text x="${x(i)}" y="${H-padB+20}" font-size="12" fill="#5c6a5f" text-anchor="middle" font-weight="600">${yr}</text>`;
  });
  svg+=`<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#cfc9b4" stroke-width="1.5"/>`;
  dens.forEach((den,di)=>{
    const data=V.data[den];const color=DEN_COLOR[den];
    const labelAbove=di===0;
    let pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
    svg+=`<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    data.forEach((v,i)=>{
      svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="5.5" fill="${color}" stroke="#fff" stroke-width="1.5"><title>${esc(den)} — ${YEARS[i]}: ${v} ${esc(V.unit)}</title></circle>`;
      svg+=`<text x="${x(i)}" y="${y(v)+(labelAbove?-11:18)}" font-size="12.5" font-weight="800" fill="${color}" text-anchor="middle">${v}</text>`;
    });
  });
  svg+="</svg>";
  return svg;
}

/* ===================== Screen 15 — Feedback Loop Modeler ===================== */
registerScreen(15,{title:"Build the Feedback Loop",
  render(){
    const m=state.feedbackModel;
    return `<div class="screen">
      ${scene({stamp:"Systems Model",title:"Build the Feedback Loop",sub:"Use the evidence to construct a repeating cause-and-effect model."})}
      <div class="loop-builder">
        <h2>Build Your Ridge Den Feedback Model</h2>
        <p class="loop-build-intro"><strong>Use four evidence cards</strong> to fill the feedback loop. Drag a card into a box, or select a card to place it in the first open box. You do not need to check the model; your explanation will justify the connections you made.</p>
        <div class="loop-build-layout">
          <aside class="loop-evidence-bank" aria-labelledby="loopBankTitle">
            <h3 id="loopBankTitle">Evidence Bank</h3>
            <div class="loop-bank-list" id="loopBank"></div>
            <button type="button" class="loop-reset-btn" id="resetLoop">Reset Loop</button>
            <p class="loop-bank-tip">Tip: A feedback loop should circle back. The last step should make an earlier step more likely to happen again.</p>
          </aside>
          <section class="loop-model-panel" aria-label="Four-step feedback loop">
            <div class="loop-cycle-stage" id="loopCycle">
              <svg class="loop-cycle-svg" viewBox="0 0 100 100" aria-hidden="true">
                <defs><marker id="loopArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#aeb8bf"></path></marker></defs>
                <path d="M58 18 C75 20 82 31 82 43" marker-end="url(#loopArrow)"></path>
                <path d="M82 58 C80 74 69 82 57 82" marker-end="url(#loopArrow)"></path>
                <path d="M42 82 C26 80 18 69 18 57" marker-end="url(#loopArrow)"></path>
                <path d="M18 42 C20 26 31 18 43 18" marker-end="url(#loopArrow)"></path>
              </svg>
              ${[0,1,2,3].map(i=>`<div class="loop-drop-zone" data-slot="${i}" role="group" aria-label="Feedback loop step ${i+1}"></div>`).join("")}
            </div>
            <p class="loop-sequence-note">Step 1 → Step 2 → Step 3 → Step 4 → Step 1 again</p>
          </section>
        </div>
        <div class="model-justification">
          ${promptBox("What happens when your feedback loop repeats over time? Use evidence from the Ridge Den investigation to justify why the connections in your model make sense.")}
          ${textField("model_explanation","Your model justification","feedbackModel.explanation","Explain the arrows in your model and what may happen as the cycle continues.")}
          <p class="loop-completion-hint" id="loopCompletionHint">Complete the four-step model and justification when you are ready. You may continue at any time.</p>
        </div>
      </div>
    </div>`;
  },
  init(root){
    const m=state.feedbackModel;
    const bank=$("#loopBank",root);
    const zones=$$(".loop-drop-zone",root);
    let draggedId="";
    let draggedFrom=-1;

    function cardById(id){return FEEDBACK_STEPS.find(card=>card.id===id);}
    function firstOpenSlot(){return m.slots.findIndex(id=>!id);}
    function slotsComplete(){return m.slots.length===4&&m.slots.every(Boolean);}
    function refreshContinue(){
      const explanation=(m.explanation||"").trim();
      setContinue(true);
      const hint=$("#loopCompletionHint",root);
      if(hint){
        if(!slotsComplete())hint.textContent=`You may continue at any time. Your model still has ${m.slots.filter(id=>!id).length} open box${m.slots.filter(id=>!id).length===1?"":"es"}.`;
        else if(explanation.length<15)hint.textContent="You may continue at any time. Add a sentence that justifies the connections in your completed model.";
        else hint.textContent="Your feedback model and evidence-based justification are ready.";
      }
    }
    function placeCard(id,targetIndex){
      if(!cardById(id)||targetIndex<0||targetIndex>3)return;
      const existingIndex=m.slots.indexOf(id);
      const targetValue=m.slots[targetIndex];
      if(existingIndex===targetIndex)return;
      if(existingIndex>-1){
        m.slots[existingIndex]=targetValue||"";
      }else if(targetValue){
        m.slots[targetIndex]="";
      }
      m.slots[targetIndex]=id;
      recordInteractionEncounter("feedbackModel:slots");saveState();renderBuilder();
    }
    function removeCard(index){m.slots[index]="";recordInteractionEncounter("feedbackModel:slots");saveState();renderBuilder();}
    function renderBank(){
      const used=new Set(m.slots.filter(Boolean));
      bank.innerHTML=FEEDBACK_STEPS.map(card=>`<button type="button" class="loop-bank-chip ${used.has(card.id)?"is-used":""}" draggable="true" data-card-id="${card.id}"><span class="chip-tag">${esc(card.tag)}</span>${esc(card.text)}</button>`).join("");
      $$(".loop-bank-chip",bank).forEach(chip=>{
        chip.addEventListener("click",()=>{const open=firstOpenSlot();if(open>-1)placeCard(chip.dataset.cardId,open);});
        chip.addEventListener("dragstart",e=>{draggedId=chip.dataset.cardId;draggedFrom=-1;e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",draggedId);});
      });
    }
    function renderZones(){
      zones.forEach((zone,i)=>{
        const card=cardById(m.slots[i]);
        zone.innerHTML=`<span class="loop-slot-label">Step ${i+1}</span>${card?`<div class="loop-placed-chip" draggable="true" data-card-id="${card.id}" data-from-slot="${i}">${esc(card.text)}<button type="button" class="loop-remove-chip" data-remove-slot="${i}" aria-label="Remove step ${i+1}">×</button></div>`:`<span class="loop-slot-empty">Drop here</span>`}`;
        zone.classList.toggle("filled",!!card);
      });
      $$(".loop-remove-chip",root).forEach(btn=>btn.addEventListener("click",e=>{e.stopPropagation();removeCard(Number(btn.dataset.removeSlot));}));
      $$(".loop-placed-chip",root).forEach(chip=>chip.addEventListener("dragstart",e=>{draggedId=chip.dataset.cardId;draggedFrom=Number(chip.dataset.fromSlot);e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",draggedId);}));
    }
    function renderBuilder(){renderBank();renderZones();refreshContinue();}

    zones.forEach((zone,i)=>{
      zone.addEventListener("dragover",e=>{e.preventDefault();zone.classList.add("drag-over");e.dataTransfer.dropEffect="move";});
      zone.addEventListener("dragleave",()=>zone.classList.remove("drag-over"));
      zone.addEventListener("drop",e=>{
        e.preventDefault();zone.classList.remove("drag-over");
        const id=e.dataTransfer.getData("text/plain")||draggedId;
        if(id)placeCard(id,i);
        draggedId="";draggedFrom=-1;
      });
    });
    $("#resetLoop",root).addEventListener("click",()=>{m.slots=["","","",""];recordInteractionEncounter("feedbackModel:slots");saveState();renderBuilder();});
    autoBindAll(root);
    const ta=$("#model_explanation",root);if(ta)ta.addEventListener("input",refreshContinue);
    renderBuilder();
  }
});

    function missingItems(){

/* ===================== Initialization ===================== */
function normalizeState(){
  const defaults=createDefaultState();
  if(!state||typeof state!=="object")state=defaults;
  state.lessonId="foxAtRecess";state.lessonTitle=defaults.lessonTitle;state.version="3";
  state.started=!!state.started||String(state.navigation&&state.navigation.currentScreen)!=="1";
  state.completed=!!state.completed;
  if(!state.meta)state.meta=defaults.meta;
  state.meta.lessonTitle=defaults.lessonTitle;state.meta.lessonVersion="3";state.meta.standard=state.meta.standard||defaults.meta.standard;
  delete state.meta["student"+"Label"];delete state.meta["session"+"Code"];
  if(!state.navigation)state.navigation=defaults.navigation;
  if(typeof state.navigation.secondPath!=="string")state.navigation.secondPath="";
  if(typeof state.navigation.firstPath!=="string")state.navigation.firstPath="";
  if(!state.progress)state.progress=defaults.progress;
  const legacyVisited=Array.isArray(state.progress.visitedScreens)?state.progress.visitedScreens:[];
  if(!Array.isArray(state.progress.encounteredScreens))state.progress.encounteredScreens=legacyVisited.length?legacyVisited:[1];
  if(!Array.isArray(state.progress.encounteredInteractions))state.progress.encounteredInteractions=[];
  delete state.progress.visitedScreens;
  if(!state.evidenceSelections)state.evidenceSelections=defaults.evidenceSelections;
  if(!state.evidenceSelections.mapLocations)state.evidenceSelections.mapLocations=defaults.evidenceSelections.mapLocations;
  for(const layer of ["orientation","sightings","numbers"])if(!Array.isArray(state.evidenceSelections.mapLocations[layer]))state.evidenceSelections.mapLocations[layer]=[];
  if(!state.entry)state.entry=defaults.entry;
  for(const key of Object.keys(defaults.entry))if(typeof state.entry[key]!==typeof defaults.entry[key])state.entry[key]=defaults.entry[key];
  if(!state.firstInvestigation)state.firstInvestigation=defaults.firstInvestigation;
  if(!state.firstInvestigation.gallery)state.firstInvestigation.gallery=defaults.firstInvestigation.gallery;
  if(!Array.isArray(state.firstInvestigation.gallery.photosViewed))state.firstInvestigation.gallery.photosViewed=[];
  if(typeof state.firstInvestigation.gallery.patternNote!=="string")state.firstInvestigation.gallery.patternNote="";
  if(!state.firstInvestigation.dashboard)state.firstInvestigation.dashboard=defaults.firstInvestigation.dashboard;
  if(!Array.isArray(state.firstInvestigation.dashboard.variablesViewed))state.firstInvestigation.dashboard.variablesViewed=[];
  for(const key of ["lengthNote","massNote","conditionNote","claim"])if(typeof state.firstInvestigation.dashboard[key]!=="string")state.firstInvestigation.dashboard[key]="";
  if(!DENS.includes(state.firstInvestigation.dashboard.compareDen)||state.firstInvestigation.dashboard.compareDen==="Ridge Den")state.firstInvestigation.dashboard.compareDen="Meadow Den";
  if(!state.firstInvestigation.convergence)state.firstInvestigation.convergence={combinedClaim:""};
  if(typeof state.firstInvestigation.convergence.combinedClaim!=="string")state.firstInvestigation.convergence.combinedClaim="";
  if(!state.secondInvestigation)state.secondInvestigation=defaults.secondInvestigation;
  if(!state.secondInvestigation.habitat)state.secondInvestigation.habitat=defaults.secondInvestigation.habitat;
  if(!Array.isArray(state.secondInvestigation.habitat.yearsViewed))state.secondInvestigation.habitat.yearsViewed=[];
  state.secondInvestigation.habitat.yearsViewed=state.secondInvestigation.habitat.yearsViewed.map(Number).filter(year=>HABITAT_YEARS.includes(year));
  if(typeof state.secondInvestigation.habitat.teamNote!=="string")state.secondInvestigation.habitat.teamNote="";
  state.secondInvestigation.habitat.selectedYear=HABITAT_YEARS.includes(Number(state.secondInvestigation.habitat.selectedYear))?Number(state.secondInvestigation.habitat.selectedYear):2022;
  if(!state.secondInvestigation.food)state.secondInvestigation.food=defaults.secondInvestigation.food;
  for(const key of ["selectedHotspots","foundCorrect","viewedRecords"])if(!Array.isArray(state.secondInvestigation.food[key]))state.secondInvestigation.food[key]=[];
  for(const key of ["teamNote","lastFeedbackId","lastRecordId"])if(typeof state.secondInvestigation.food[key]!=="string")state.secondInvestigation.food[key]="";
  if(!state.secondInvestigation.convergence)state.secondInvestigation.convergence={combinedExplanation:""};
  if(typeof state.secondInvestigation.convergence.combinedExplanation!=="string")state.secondInvestigation.convergence.combinedExplanation="";
  if(!state.feedbackModel)state.feedbackModel=defaults.feedbackModel;
  if(!Array.isArray(state.feedbackModel.slots)||state.feedbackModel.slots.length!==4)state.feedbackModel.slots=["","","",""];
  const validModelIds=new Set(FEEDBACK_STEPS.map(step=>step.id)),usedModelIds=new Set();
  state.feedbackModel.slots=state.feedbackModel.slots.map(id=>{if(typeof id!=="string"||!validModelIds.has(id)||usedModelIds.has(id))return "";usedModelIds.add(id);return id;});
  if(typeof state.feedbackModel.explanation!=="string")state.feedbackModel.explanation="";
  if(!state.recommendation)state.recommendation=defaults.recommendation;
  if(!Array.isArray(state.recommendation.actions))state.recommendation.actions=[];
  state.recommendation.actions=state.recommendation.actions.filter(id=>RECOMMENDATION_ACTIONS.some(action=>action.id===id)).slice(0,3);
  for(const key of ["habitatEvidence","foodEvidence","reasoning","finalText"])if(typeof state.recommendation[key]!=="string")state.recommendation[key]="";
  if(!state.reflection)state.reflection=defaults.reflection;
  for(const key of ["evidenceStrength","humanChoices"])if(typeof state.reflection[key]!=="string")state.reflection[key]="";
  if(!state.quiz)state.quiz=defaults.quiz;
  if(!["","take","skip"].includes(state.quiz.choice))state.quiz.choice="";
  if(!state.quiz.answers||typeof state.quiz.answers!=="object")state.quiz.answers={};
  if(!state.quiz.revisions||typeof state.quiz.revisions!=="object")state.quiz.revisions={};
  if(!Array.isArray(state.quiz.attempts))state.quiz.attempts=[];
  state.quiz.started=!!state.quiz.started||state.quiz.choice==="take"||Object.keys(state.quiz.answers).length>0;
  state.quiz.submitted=!!state.quiz.submitted;state.quiz.completed=!!state.quiz.completed||state.quiz.submitted;
  state.quiz.score=state.quiz.score==null?null:Number(state.quiz.score);
  if(state.navigation.currentScreen==="6A")state.navigation.currentScreen=state.navigation.firstPath==="gallery"?"8A":7;
  if(state.navigation.currentScreen==="6B")state.navigation.currentScreen=state.navigation.firstPath==="dashboard"?"8B":7;
  state.navigation.currentScreen=normalizeRequestedScreen(state.navigation.currentScreen);
}
function initialize(){
  state=loadState()||createDefaultState();
  normalizeState();
  if(!SCREENS[state.navigation.currentScreen])state.navigation.currentScreen=1;
  recordScreenEncounter(state.navigation.currentScreen);
  saveState();
  renderScreen();
}
$("#glossaryBtn").addEventListener("click",openGlossary);
$("#journalBtn").addEventListener("click",openJournal);
$("#restartBtn").addEventListener("click",openRestartModal);
$("#backBtn").addEventListener("click",prevScreen);
initialize();
</script>
</body>
</html>
